<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mood and how it is made</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#514a7d">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#494370">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --ink:#2d2d2a; --gray:#6e6e69; --bg:#ffffff;
  --peaceful:#c0dd97; --peaceful-dark:#3d4730;
  --inspiring:#cecbf6; --inspiring-dark:#42414f;
  --joyful:#fac775; --joyful-dark:#504025;
  --sorrowful:#b5d4f4; --sorrowful-dark:#3a444e;
  --dark:#d3d1c7; --dark-dark:#444340;
  --aggressive:#f09595; --aggressive-dark:#4d3030;
  --dyn:#a8decb; --dyn-tint:#e1f5ee; --dyn-dark:#32433d;
  --tempo:#f5c4b3; --tempo-tint:#faece7; --tempo-dark:#4a3b36;
  --rhythm:#f4c0d1; --rhythm-tint:#fbeaf0; --rhythm-dark:#493a3f;
  --texture:#fac775; --texture-tint:#faeeda; --texture-dark:#4b3c23;
  --radius:10px;
  --card:#ffffff;            /* popover surface */
  --hover:rgba(0,0,0,.05);
  --press:rgba(0,0,0,.12);
}
/* Dark mode. The mood chips keep their pastel fill and dark text — a badge
   reads fine either way — but the page surface, the text, the four column
   tints and the popover all have to flip, or a student in dark mode gets
   dark text on a pale tint (or a white card in the middle of a dark page).
   The *-dark tokens above were already defined for this. */
@media(prefers-color-scheme:dark){
  :root{
    --ink:#e8e6df; --gray:#a3a39a; --bg:#1e1e1c;
    --card:#272724;
    --hover:rgba(255,255,255,.08);
    --press:rgba(255,255,255,.16);
    --dyn-tint:#26332e; --tempo-tint:#382c28; --rhythm-tint:#372b30; --texture-tint:#382e1c;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.35;
}
.wrap{max-width:1180px; margin:0 auto; padding:28px 20px 60px}
h1{font-size:clamp(1.6rem,3.5vw,2.1rem); margin:0 0 4px; letter-spacing:-0.01em}
.sub{color:var(--gray); font-size:.95rem; margin:0 0 26px}

/* ---------- back link ----------
   The Explore nav opens this page in a NEW tab, so browser Back is dead on
   arrival — hence a real link home. When the app tab that spawned us is still
   around, the link closes this tab instead of stacking a second copy of the
   site (see the click handler below). */
.crumb{margin:0 0 20px}
.crumb a{
  display:inline-flex; align-items:center; gap:6px;
  font-size:.88rem; font-weight:600; color:var(--gray); text-decoration:none;
  padding:6px 12px; border-radius:999px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);
}
.crumb a:hover{color:var(--ink); background:var(--hover)}
.crumb a:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

/* ---------- matrix ---------- */
.chart{display:grid; grid-template-columns:minmax(230px,1.9fr) repeat(4,1fr); gap:10px}
.moodgroup{display:contents}
.colhead{border-radius:6px; padding:8px 12px 9px; align-self:end}
.colhead b{display:block; font-size:.85rem}
.colhead span{display:block; font-size:.72rem; opacity:.85}
.colhead.dyn{background:var(--dyn); color:var(--dyn-dark)}
.colhead.tempo{background:var(--tempo); color:var(--tempo-dark)}
.colhead.rhythm{background:var(--rhythm); color:var(--rhythm-dark)}
.colhead.texture{background:var(--texture); color:var(--texture-dark)}
.spacer{background:none}

.mood{border-radius:var(--radius); padding:14px 18px}
.mood h2{margin:0 0 8px; font-size:1.5rem}
.mood ul{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(3,1fr); gap:3px 10px; font-size:.98rem}
.mood.peaceful{background:var(--peaceful); color:var(--peaceful-dark)}
.mood.inspiring{background:var(--inspiring); color:var(--inspiring-dark)}
.mood.joyful{background:var(--joyful); color:var(--joyful-dark)}
.mood.sorrowful{background:var(--sorrowful); color:var(--sorrowful-dark)}
.mood.dark{background:var(--dark); color:var(--dark-dark)}
.mood.aggressive{background:var(--aggressive); color:var(--aggressive-dark)}

.cell{border-radius:8px; padding:10px 8px; display:flex; flex-direction:column; align-items:flex-start; gap:2px}
.cell.dyn{background:var(--dyn-tint)}
.cell.tempo{background:var(--tempo-tint)}
.cell.rhythm{background:var(--rhythm-tint)}
.cell.texture{background:var(--texture-tint)}
.cell .cat{display:none}

.word{
  appearance:none; border:0; background:transparent; color:var(--ink);
  font:inherit; font-size:.92rem; padding:3px 7px; border-radius:6px;
  cursor:pointer; text-align:left;
}
.word:hover{background:var(--hover)}
.word:focus-visible{outline:2px solid var(--ink); outline-offset:1px}
.word[aria-expanded="true"]{background:var(--press)}

/* ---------- popover ---------- */
.pop{
  position:absolute; z-index:50; max-width:290px; min-width:220px;
  background:var(--card); border-radius:12px; padding:13px 15px 14px;
  box-shadow:0 6px 24px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.06);
  border-top:5px solid var(--gray);
}
.pop[data-cat="Dynamics"]{border-top-color:var(--dyn)}
.pop[data-cat="Tempo"]{border-top-color:var(--tempo)}
.pop[data-cat="Rhythm"]{border-top-color:var(--rhythm)}
.pop[data-cat="Texture"]{border-top-color:var(--texture)}
.pop .eyebrow{font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--gray); margin:0 0 3px}
.pop h3{margin:0 0 5px; font-size:1.1rem}
.pop p{margin:0; font-size:.92rem}
.pop .hear{display:inline-block; margin-top:9px; font-size:.88rem; font-weight:600; color:var(--rhythm-dark); text-decoration:underline; text-underline-offset:2px}
.pop .close{
  position:absolute; top:6px; right:8px; appearance:none; border:0; background:none;
  font-size:1.05rem; line-height:1; color:var(--gray); cursor:pointer; padding:4px;
}
.pop .close:focus-visible{outline:2px solid var(--ink)}
.backdrop{display:none}

/* ---------- small screens ---------- */
@media (max-width:900px){
  .chart{grid-template-columns:1fr; gap:14px}
  .colhead,.spacer{display:none}
  .moodgroup{display:block; border-radius:var(--radius); overflow:hidden; box-shadow:0 0 0 1px rgba(0,0,0,.05)}
  .mood{border-radius:0}
  .mood ul{grid-template-columns:repeat(2,1fr)}
  .cell{border-radius:0; padding:10px 14px}
  .cell .cat{display:block; font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin-bottom:2px}
  .cell.dyn .cat{color:var(--dyn-dark)}
  .cell.tempo .cat{color:var(--tempo-dark)}
  .cell.rhythm .cat{color:var(--rhythm-dark)}
  .cell.texture .cat{color:var(--texture-dark)}
  .cell{flex-direction:row; flex-wrap:wrap; align-items:center; gap:2px 4px}
  .cell .cat{flex-basis:100%}
}
@media (max-width:640px){
  .pop{
    position:fixed; left:12px; right:12px; bottom:12px; top:auto;
    max-width:none; min-width:0;
  }
  .backdrop{display:block; position:fixed; inset:0; background:rgba(0,0,0,.25); z-index:40}
  .backdrop[hidden]{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .12s ease-out}
  @keyframes pop{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
}
</style>
</head>
<body>
<div class="wrap">
  <p class="crumb"><a href="index.html" id="back-link">&larr; Back to class site</a></p>
  <h1>Mood and how it is made</h1>
  <p class="sub">Pick a mood, then choose one option from each column. Tap any word to see what it means &mdash; rhythm words include a listening example.</p>
  <div class="chart" id="chart"></div>
</div>

<div class="backdrop" id="backdrop" hidden></div>

/* Back link: if the app tab that opened us is still open, hop back to it and
   close this one rather than loading a second copy of the site here. */
document.getElementById("back-link").addEventListener("click", e => {
  if (window.opener && !window.opener.closed){
    e.preventDefault();
    try { window.opener.focus(); } catch (_) {}
    window.close();
  }
});

const ES_CATS = {
  "Dynamics": {
    "name": "Dinámica",
    "q": "¿Qué tan fuerte?"
  },
  "Tempo": {
    "name": "Tempo",
    "q": "¿Qué tan rápido?"
  },
  "Rhythm": {
    "name": "Ritmo",
    "q": "¿Qué patrón?"
  },
  "Texture": {
    "name": "Textura",
    "q": "¿Gruesa o delgada?"
  }
};
const ES_UI = {
  "title": "El ánimo y cómo se construye",
  "back": "&larr; Volver al sitio de la clase",
  "sub": "Elige un ánimo y luego una opción de cada columna. Toca cualquier palabra para ver qué significa — las palabras de ritmo traen un ejemplo para escuchar.",
  "close": "Cerrar",
  "hear": "Escúchalo"
};
let LANG = 'en';
try { if (localStorage.getItem('gc-lang') === 'es') LANG = 'es'; } catch (e) {}
const isES = () => LANG === 'es';
/* word as the student reads it (English is the key) */
const tw = w => (isES() && ES_WORDS[w]) || w;
const tcat = c => (isES() && ES_CATS[c] && ES_CATS[c].name) || c;
const tq = (c, q) => (isES() && ES_CATS[c] && ES_CATS[c].q) || q;
const tdef = (c, w) => (isES() && ES_DEFS[c] && ES_DEFS[c][w]) || DATA.defs[c][w];
const tui = k => (isES() && ES_UI[k]) || null;

if (isES()) {
  document.documentElement.lang = 'es';
  document.title = ES_UI.title;
  document.addEventListener('DOMContentLoaded', () => {
    const h1 = document.querySelector('h1');
    const sub = document.querySelector('.sub');
    const back = document.getElementById('back-link');
    if (h1) h1.textContent = ES_UI.title;
    if (sub) sub.textContent = ES_UI.sub;
    if (back) back.innerHTML = ES_UI.back;
  });
}

const CATS = [
  {key:"dynamics", name:"Dynamics", q:"How loud?", cls:"dyn"},
  {key:"tempo",    name:"Tempo",    q:"How fast?", cls:"tempo"},
  {key:"rhythm",   name:"Rhythm",   q:"What pattern?", cls:"rhythm"},
  {key:"texture",  name:"Texture",  q:"Thick or thin?", cls:"texture"},
];

const chart = document.getElementById("chart");
const backdrop = document.getElementById("backdrop");

/* headers */
chart.insertAdjacentHTML("beforeend", '<div class="spacer"></div>' + CATS.map(c =>
  `<div class="colhead ${c.cls}"><b>${tcat(c.name)}</b><span>${tq(c.name, c.q)}</span></div>`).join(""));

/* rows */
DATA.moods.forEach((m, i) => {
  const slug = m.name.toLowerCase();
  const moodHtml =
    `<div class="mood ${slug}"><h2>${tw(m.name)}</h2><ul>` +
    m.specifics.map(s => `<li>${tw(s)}</li>`).join("") + `</ul></div>`;
  const cells = CATS.map(c => {
    const words = DATA[c.key][i].map(w =>
      `<button class="word" type="button" data-cat="${c.name}" data-word="${w}" aria-expanded="false" aria-haspopup="dialog">${tw(w)}</button>`
    ).join("");
    return `<div class="cell ${c.cls}"><span class="cat">${tcat(c.name)} &mdash; ${tq(c.name, c.q)}</span>${words}</div>`;
  }).join("");

  chart.insertAdjacentHTML("beforeend", `<div class="moodgroup">${moodHtml}${cells}</div>`);
});

/* popover */
let pop = null, openBtn = null;

function closePop(){
  if (pop) pop.remove();
  pop = null;
  backdrop.hidden = true;
  if (openBtn){ openBtn.setAttribute("aria-expanded","false"); openBtn.focus(); openBtn = null; }
}

function openPop(btn){
  closePop();
  const cat = btn.dataset.cat, word = btn.dataset.word;
  let def = tdef(cat, word);
  def = def.charAt(0).toUpperCase() + def.slice(1);
  if (!/[.!?]$/.test(def)) def += ".";
  const q = CATS.find(c => c.name === cat).q;
  const hear = (cat === "Rhythm" && DATA.hear[word])
    ? `<a class="hear" href="${DATA.hear[word].url}" target="_blank" rel="noopener">${tui('hear') || 'Hear it'}: ${DATA.hear[word].title} &rarr;</a>` : "";
  pop = document.createElement("div");
  pop.className = "pop";
  pop.dataset.cat = cat;
  pop.setAttribute("role","dialog");
  pop.setAttribute("aria-label", tw(word));
  pop.innerHTML =
    `<button class="close" type="button" aria-label="${tui('close') || 'Close'}">&times;</button>` +
    `<p class="eyebrow">${tcat(cat)} &mdash; ${tq(cat, q)}</p><h3>${tw(word)}</h3><p>${def}</p>${hear}`;
  document.body.appendChild(pop);

  const small = window.matchMedia("(max-width:640px)").matches;
  if (small){
    backdrop.hidden = false;
  } else {
    const r = btn.getBoundingClientRect();
    const pw = pop.offsetWidth, ph = pop.offsetHeight;
    let x = r.left + window.scrollX;
    let y = r.bottom + window.scrollY + 6;
    if (x + pw > window.scrollX + document.documentElement.clientWidth - 8)
      x = window.scrollX + document.documentElement.clientWidth - pw - 8;
    if (r.bottom + ph + 12 > window.innerHeight)
      y = r.top + window.scrollY - ph - 6;
    pop.style.left = x + "px";
    pop.style.top = Math.max(y, window.scrollY + 8) + "px";
  }
  openBtn = btn;
  btn.setAttribute("aria-expanded","true");
  pop.querySelector(".close").addEventListener("click", closePop);
}

document.addEventListener("click", e => {
  const btn = e.target.closest(".word");
  if (btn){
    if (btn === openBtn){ closePop(); } else { openPop(btn); }
    e.stopPropagation();
    return;
  }
  if (pop && !e.target.closest(".pop")) closePop();
});
backdrop.addEventListener("click", closePop);
document.addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });
</script>
