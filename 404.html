<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Content-Security-Policy — identical to index.html's policy; the
     comment there explains what each directive is protecting. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  base-uri 'self';
  object-src 'none';
  img-src 'self' data: https:;
  media-src 'self' blob:;
  worker-src 'self' blob:;
  font-src 'self' data: https://fonts.gstatic.com https://www.gstatic.com;
  style-src 'self' 'unsafe-inline' https://www.gstatic.com https://fonts.googleapis.com;
  script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://apis.google.com;
  connect-src 'self' https://*.googleapis.com https://*.google.com https://*.gstatic.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com;
  frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://content.googleapis.com https://www.youtube.com https://www.youtube-nocookie.com https://youtube.com https://docs.google.com https://drive.google.com https://www.google.com;
">
<title>Page not found · Guitar Class · Sequoia HS</title>
<meta name="description" content="That page isn't here — but your guitar class is.">
<link rel="stylesheet" href="styles.css" id="nf-css">
<script>
/* GitHub Pages serves this page AT the missing URL, so the document base is
   whatever broken path was requested — a nested miss like /guitar-class/tabs/x
   would resolve the relative styles.css / index.html links against /tabs/.
   Compute the site root instead: on *.github.io the site lives one segment
   deep (/guitar-class/); on Live Server it's just /. The relative attributes
   above and below stay as the no-JS fallback (correct for top-level misses).
   No hardcoded repo name — the first path segment IS the repo on Pages. */
(function(){
  var root = location.pathname.split('/').slice(0, location.hostname.endsWith('github.io') ? 2 : 1).join('/') + '/';
  document.getElementById('nf-css').href = root + 'styles.css';
  document.addEventListener('DOMContentLoaded', function(){
    document.getElementById('nf-home').href = root + 'index.html';
  });
})();
</script>
<style>
  body{min-height:100vh;display:flex;flex-direction:column}
  .notfound-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 20px}
  .notfound-emoji{font-size:64px;line-height:1}
  .notfound-main h1{font-size:26px;font-weight:650;margin:18px 0 8px;color:var(--text)}
  .notfound-main p{font-size:16px;color:var(--text2);max-width:420px;margin:0 0 28px}
  .notfound-home{display:inline-block;padding:14px 32px;font-size:17px;font-weight:600;border-radius:999px;background:#322b78;color:#fff;text-decoration:none}
  .notfound-home:hover{background:#40378f}
  .notfound-sub{margin-top:22px;font-size:14px;color:var(--text3)}
</style>
</head>
<body>
<header class="header">
  <div>
    <div class="header-title">Sequoia High School &ndash; Beginning Guitar</div>
    <div class="header-sub">Independent Practice and Skills Tracker</div>
  </div>
</header>
<main class="notfound-main">
  <div class="notfound-emoji">&#x1F3B8;</div>
  <h1>That page isn't here &mdash; but your guitar class is.</h1>
  <p>The link you followed doesn't match a page on this site anymore.</p>
  <a class="notfound-home" id="nf-home" href="./index.html">Back to Guitar Class</a>
  <p class="notfound-sub">Looking for a song? All six Song Journeys are on the home page.</p>
</main>
</body>
</html>
