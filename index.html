<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f7f6f3;--bg3:#eeecea;
  --text:#1a1a18;--text2:#6b6b65;--text3:#aaaaa3;
  --border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.16);
  --blue-bg:#e6f1fb;--blue-text:#185fa5;
  --green-bg:#eaf3de;--green-text:#3b6d11;
  --amber-bg:#faeeda;--amber-text:#854f0b;
  --radius:10px;--radius-sm:6px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1e1e1c;--bg2:#272724;--bg3:#313130;
    --text:#e8e6df;--text2:#888880;--text3:#555550;
    --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
    --blue-bg:#0c3a6b;--blue-text:#93c4f0;
    --green-bg:#1e4208;--green-text:#a8d070;
    --amber-bg:#4a2a04;--amber-text:#f0b84a;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg2);color:var(--text);min-height:100vh}
.header{background:var(--bg);border-bottom:0.5px solid var(--border2);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.header-title{font-size:15px;font-weight:500}
.header-sub{font-size:12px;color:var(--text2);margin-top:1px}
.user-area{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover}
.avatar-init{width:32px;height:32px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--text2)}
.user-name{font-size:13px;color:var(--text2)}
.btn-sign{padding:6px 14px;font-size:13px;border:0.5px solid var(--border2);border-radius:20px;background:transparent;color:var(--text);cursor:pointer}
.btn-sign:hover{background:var(--bg3)}
.btn-out{padding:5px 12px;font-size:12px;border:0.5px solid var(--border);border-radius:20px;background:transparent;color:var(--text2);cursor:pointer}
.btn-out:hover{background:var(--bg3)}
.auth-wall{max-width:400px;margin:80px auto;padding:0 20px;text-align:center}
.auth-wall h1{font-size:22px;font-weight:500;margin-bottom:10px}
.auth-wall p{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:28px}
.btn-google{display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);font-size:14px;cursor:pointer}
.btn-google:hover{background:var(--bg3)}
.btn-google svg{width:18px;height:18px;flex-shrink:0}
.main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
.sec-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-bottom:8px}
.week-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.wpill{padding:5px 14px;font-size:13px;border:0.5px solid var(--border2);border-radius:20px;background:var(--bg);color:var(--text2);cursor:pointer;transition:all 0.15s;position:relative}
.wpill:hover:not(.locked){border-color:var(--text2);color:var(--text)}
.wpill.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.wpill.locked{opacity:.35;cursor:default}
.wpill.incomplete::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--amber-text);position:absolute;top:3px;right:3px}
.week-panel{display:none}.week-panel.active{display:block}
.obj-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.obj-unit{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-bottom:5px}
.obj-main{font-size:15px;font-weight:500;line-height:1.5;margin-bottom:5px}
.obj-sub{font-size:13px;color:var(--text2);line-height:1.6}
.tabs{display:flex;border-bottom:0.5px solid var(--border2);margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 16px;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;flex-shrink:0}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);font-weight:500;border-bottom-color:var(--text)}
.tab-panel{display:none}.tab-panel.active{display:block}
.st-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stc{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:border-color 0.15s}

.st-ico{font-size:20px;margin-bottom:8px}
.st-badge{font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:10px;display:inline-block;margin-bottom:6px}
.ba{background:var(--blue-bg);color:var(--blue-text)}
.bb{background:var(--green-bg);color:var(--green-text)}
.bc{background:var(--amber-bg);color:var(--amber-text)}
.st-name{font-size:13px;font-weight:500;margin-bottom:2px}
.st-desc{font-size:12px;color:var(--text2)}

.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:4px 16px;margin-bottom:12px}
.song-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border)}
.song-row:last-child{border-bottom:none}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}

.smeta{font-size:12px;color:var(--text2);margin-top:1px}
.stag{font-size:10px;padding:2px 8px;border-radius:10px;margin-left:auto;flex-shrink:0;white-space:nowrap;background:var(--bg2);color:var(--text2)}
.stag-core{background:var(--blue-bg);color:var(--blue-text)}
.legend{display:flex;gap:14px;margin-bottom:8px}

.vid-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border)}

.vname{font-size:13px;font-weight:500}

.vsrc{font-size:12px;color:var(--text2);margin-top:1px}
.vrec{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--amber-bg);color:var(--amber-text);margin-top:3px;display:inline-block}

.albl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-bottom:4px}

.spill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;border:0.5px solid var(--border2);color:var(--text2);margin:2px 2px 0 0}

.skill-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--border)}

.skchk.done{background:var(--green-bg);border-color:var(--green-text)}

.sktxt{font-size:13px;line-height:1.5}
.skwk{font-size:10px;padding:1px 7px;border-radius:10px;background:var(--bg3);color:var(--text2);margin-left:auto;flex-shrink:0;white-space:nowrap}
.prog-wrap{margin:14px 0 4px}
.prog-row{display:flex;align-items:center;gap:8px}
.prog-bg{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--green-text);border-radius:3px;transition:width 0.3s}

<script>
/* ── Firebase init ── */
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db   = firebase.firestore();
let currentUser = null;
let progress    = {};
let saveTimer   = null;

/* ── Auth ── */
function signIn(){
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .catch(e=>alert('Sign-in error: '+e.message));
}
function signOut(){ auth.signOut(); }

auth.onAuthStateChanged(async user=>{
  if(user){
    currentUser = user;
    await loadProgress();
    showApp(user);
  } else {
    currentUser = null; progress = {};
    document.getElementById('auth-wall').style.display='block';
    document.getElementById('app').style.display='none';
    document.getElementById('user-area').innerHTML=
      '<button class="btn-sign" onclick="signIn()">Sign in with Google</button>';
  }
});

function showApp(user){
  document.getElementById('auth-wall').style.display='none';
  document.getElementById('app').style.display='block';
  const av = user.photoURL
    ? `<img src="${user.photoURL}" class="avatar" alt="">`
    : `<div class="avatar-init">${(user.displayName||'?')[0].toUpperCase()}</div>`;
  document.getElementById('user-area').innerHTML=
    `${av}<span class="user-name">${user.displayName||user.email}</span>
     <button class="btn-out" onclick="signOut()">Sign out</button>`;
  renderAll();
}

/* ── Firestore ── */
async function loadProgress(){
  try{
    const doc = await db.collection('progress').doc(currentUser.uid).get();
    progress = doc.exists ? (doc.data().skills||{}) : {};
  } catch(e){ progress={}; }
}

function saveProgress(){
  if(!currentUser) return;
  clearTimeout(saveTimer);
  setSaveMsg('Saving…');
  saveTimer = setTimeout(async()=>{
    try{
      await db.collection('progress').doc(currentUser.uid).set({skills:progress},{merge:true});
      setSaveMsg('Saved ✓');
      setTimeout(()=>setSaveMsg(''),2000);
    } catch(e){ setSaveMsg('Save failed — check connection'); }
  },800);
}
function setSaveMsg(msg){ document.querySelectorAll('.save-ind').forEach(el=>el.textContent=msg); }

/* ── Render all ── */
function renderAll(){
  renderPills();
  renderPanels();
  const first = WEEKS.find(w=>!w.locked);
  if(first) activateWeek(first.id);
}

function renderPills(){
  const c = document.getElementById('week-pills');
  c.innerHTML='';
  WEEKS.forEach(w=>{
    const btn = document.createElement('button');
    btn.className='wpill'+(w.locked?' locked':'');
    btn.dataset.id=w.id;
    btn.textContent=w.label;
    if(!w.locked && w.skills && w.skills.length>0){
      const done=w.skills.filter(s=>progress[s.id]).length;
      if(done<w.skills.length) btn.classList.add('incomplete');
    }
    if(!w.locked) btn.onclick=()=>activateWeek(w.id);
    c.appendChild(btn);
  });
}

function activateWeek(id){
  document.querySelectorAll('.wpill').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  document.querySelectorAll('.week-panel').forEach(p=>p.classList.toggle('active',p.dataset.id===id));
}

function renderPanels(){
  const c=document.getElementById('week-panels');
  c.innerHTML='';
  WEEKS.forEach(w=>{
    const div=document.createElement('div');
    div.className='week-panel'; div.dataset.id=w.id;
    div.innerHTML = w.comingSoon ? buildComingSoon(w) : buildWeek(w);
    c.appendChild(div);
  });
}

/* ── Coming soon ── */
function buildComingSoon(w){
  return `<div class="obj-card">
    <div class="obj-unit">${w.unit}</div>
    <div class="obj-main">${w.title}</div>
    <div class="obj-sub">${w.subtitle}</div>
  </div>
  <div class="coming">
    <div class="big">🎸</div>
    <p>This week's content will appear here when it's ready.<br>Check back soon!</p>
  </div>`;
}

/* ── Full week ── */
function buildWeek(w){
  return `<div class="obj-card">
    <div class="obj-unit">${w.unit}</div>
    <div class="obj-main">${w.objective}</div>
    <div class="obj-sub">${w.skillFocus}</div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab(this,'${w.id}','stations')">Stations</div>
    <div class="tab" onclick="switchTab(this,'${w.id}','songs')">Songs</div>
    <div class="tab" onclick="switchTab(this,'${w.id}','videos')">Videos</div>
    <div class="tab" onclick="switchTab(this,'${w.id}','assess')">Assessment</div>
    <div class="tab" onclick="switchTab(this,'${w.id}','checklist')">My checklist</div>
  </div>
  <div id="${w.id}-stations" class="tab-panel active">${buildStations(w)}</div>
  <div id="${w.id}-songs"    class="tab-panel">${buildSongs(w)}</div>
  <div id="${w.id}-videos"   class="tab-panel">${buildVideos(w)}</div>
  <div id="${w.id}-assess"   class="tab-panel">${buildAssess(w)}</div>
  <div id="${w.id}-checklist" class="tab-panel">${buildChecklist(w)}</div>`;
}

function switchTab(el,wid,tab){
  const panel=document.querySelector(`.week-panel[data-id="${wid}"]`);
  panel.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  panel.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(`${wid}-${tab}`).classList.add('active');
}

/* ── Stations ── */
function buildStations(w){
  const stepsHtml=steps=>steps.map((s,i)=>`
    <li class="step">
      <div class="sn">${i+1}</div>
      <div class="st">${s.text}${s.hint?`<div class="sh">${s.hint}</div>`:''}</div>
    </li>`).join('');
  const dp=(id,cls,badge,badgeClass,s)=>`
    <div class="dp${cls}" id="${w.id}-dp-${id}">
      <div class="dp-head">
        <span class="st-badge ${badgeClass}">${badge}</span>
        <div class="dp-title">${s.title}</div>
        <div class="dp-time">${s.time}</div>
      </div>
      <ul class="steps">${stepsHtml(s.steps)}</ul>
    </div>`;
  return `
    <div class="st-grid">
      <div class="stc active" id="${w.id}-sc-a" onclick="openSt('${w.id}','a')">
        <div class="st-ico">👤</div>
        <span class="st-badge ba">Station A</span>
        <div class="st-name">Teacher station</div>
        <div class="st-desc">Small group with teacher</div>
      </div>
      <div class="stc" id="${w.id}-sc-b" onclick="openSt('${w.id}','b')">
        <div class="st-ico">💻</div>
        <span class="st-badge bb">Station B</span>
        <div class="st-name">Computer station</div>
        <div class="st-desc">Watch & respond independently</div>
      </div>
      <div class="stc" id="${w.id}-sc-c" onclick="openSt('${w.id}','c')">
        <div class="st-ico">🎸</div>
        <span class="st-badge bc">Station C</span>
        <div class="st-name">Practice station</div>
        <div class="st-desc">Independent drill</div>
      </div>
    </div>
    ${dp('a','','Station A','ba',w.stations.a)}
    ${dp('b',' hidden','Station B','bb',w.stations.b)}
    ${dp('c',' hidden','Station C','bc',w.stations.c)}`;
}

function openSt(wid,s){
  ['a','b','c'].forEach(x=>{
    document.getElementById(`${wid}-sc-${x}`).classList.toggle('active',x===s);
    document.getElementById(`${wid}-dp-${x}`).classList.toggle('hidden',x!==s);
  });
}

/* ── Songs ── */
function buildSongs(w){
  const rows=w.songs.map(s=>`
    <div class="song-row">
      <div class="dot ${s.core?'dc':'dch'}"></div>
      <div><div class="sname">${s.name}</div><div class="smeta">${s.meta}</div></div>
      <span class="stag ${s.core?'stag-core':''}">${s.type}</span>
    </div>`).join('');
  return `<div class="legend">
    <div class="leg"><div class="dot dc" style="margin-top:0"></div>Core — everyone</div>
    <div class="leg"><div class="dot dch" style="margin-top:0"></div>Choice menu — pick 1</div>
  </div>
  <div class="card">${rows}</div>
  <div class="ablock">
    <div class="albl">Performance & community</div>
    <div class="atxt">${w.assessment.performance}</div>
  </div>`;
}

/* ── Videos ── */
function buildVideos(w){
  const rows=w.videos.map(v=>`
    <div class="vid-row">
      <div>
        <div class="vname"><a href="${v.url}" target="_blank">${v.name}</a></div>
        <div class="vsrc">${v.source}</div>
        ${v.rec?'<span class="vrec">★ Recommended</span>':''}
      </div>
    </div>`).join('');
  return `<div class="card">${rows}</div>`;
}

/* ── Assessment ── */
function buildAssess(w){
  const a=w.assessment;
  return `
    <div class="ablock"><div class="albl">Assessment goal</div><div class="atxt">${a.goal}</div></div>
    <div class="ablock"><div class="albl">Self-check</div><div class="atxt">${a.selfCheck}</div></div>
    <div class="ablock"><div class="albl">NAfME standards</div><div>${a.standards.map(s=>`<span class="spill">${s}</span>`).join('')}</div></div>`;
}

/* ── Checklist ── */
function buildChecklist(w){
  if(!w.skills||w.skills.length===0) return '<p style="font-size:13px;color:var(--text2);padding:12px 0">No skills listed for this week yet.</p>';
  const done=w.skills.filter(s=>progress[s.id]).length;
  const pct=Math.round(done/w.skills.length*100);
  const items=w.skills.map(s=>{
    const ck=progress[s.id]?' done':'';
    return `<div class="skill-item">
      <div class="skchk${ck}" id="chk-${s.id}" onclick="toggleSkill('${s.id}','${w.id}')">
        <svg class="ckico" width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M2 6l3 3 5-5" stroke="var(--green-text)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="sktxt">${s.text}</div>
      <span class="skwk">${w.label}</span>
    </div>`;
  }).join('');
  return `<div class="cl-intro">Check off each skill as you can do it consistently. Incomplete skills stay visible here — you can always come back to them from any device.</div>
  <div class="card">${items}</div>
  <div class="prog-wrap">
    <div class="prog-row">
      <div class="prog-bg"><div class="prog-fill" id="pf-${w.id}" style="width:${pct}%"></div></div>
      <div class="prog-lbl" id="pl-${w.id}">${done} / ${w.skills.length}</div>
    </div>
  </div>
  <div class="save-ind" id="si-${w.id}"></div>`;
}

/* ── Toggle skill ── */
function toggleSkill(sid,wid){
  progress[sid]=!progress[sid];
  const el=document.getElementById(`chk-${sid}`);
  el.classList.toggle('done',progress[sid]);
  const w=WEEKS.find(x=>x.id===wid);
  const done=w.skills.filter(s=>progress[s.id]).length;
  const pct=Math.round(done/w.skills.length*100);
  const bar=document.getElementById(`pf-${wid}`);
  const lbl=document.getElementById(`pl-${wid}`);
  if(bar) bar.style.width=pct+'%';
  if(lbl) lbl.textContent=done+' / '+w.skills.length;
  renderPills();
  document.querySelectorAll('.wpill').forEach(b=>{if(b.dataset.id===wid)b.classList.add('active');});
  saveProgress();
}
</script>
