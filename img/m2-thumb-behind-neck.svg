<svg font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif" viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thumb on the back of the neck lets fingers press cleanly; a thumb hooked over the top mutes strings">
  <rect width="100%" height="100%" fill="#ffffff"/><g>
  <text x="170" y="34" font-size="26" font-weight="700" fill="#3b6d11" text-anchor="middle">✓</text>
  <path d="M108 100 A 62 58 0 0 0 232 100 Z" fill="#fffdf8" stroke="#2f2c28" stroke-width="2.4"/>
  <path d="M108 100 H 232" stroke="#2f2c28" stroke-width="2.6" stroke-linecap="round"/>
  <g fill="#2f2c28"><circle cx="120" cy="94" r="2.6"/><circle cx="140" cy="94" r="2.6"/><circle cx="160" cy="94" r="2.6"/><circle cx="180" cy="94" r="2.6"/><circle cx="200" cy="94" r="2.6"/><circle cx="220" cy="94" r="2.6"/></g><rect x="159" y="152" width="22" height="46" rx="11" fill="#e6f1fb" stroke="#185fa5" stroke-width="2.4"/>
  <rect x="129" y="42" width="20" height="50" rx="10" fill="#e6f1fb" stroke="#185fa5" stroke-width="2.4"/></g><g>
  <text x="470" y="34" font-size="26" font-weight="700" fill="#b3372a" text-anchor="middle">✗</text>
  <path d="M408 100 A 62 58 0 0 0 532 100 Z" fill="#fffdf8" stroke="#2f2c28" stroke-width="2.4"/>
  <path d="M408 100 H 532" stroke="#2f2c28" stroke-width="2.6" stroke-linecap="round"/>
  <g fill="#2f2c28"><circle cx="420" cy="94" r="2.6"/><circle cx="440" cy="94" r="2.6"/><circle cx="460" cy="94" r="2.6"/><circle cx="480" cy="94" r="2.6"/><circle cx="500" cy="94" r="2.6"/><circle cx="520" cy="94" r="2.6"/></g><rect x="410" y="82" width="52" height="21" rx="10.5" fill="#fff" stroke="#b3372a" stroke-width="2.4"/>
  <path d="M476 108 q 7 -8 14 0 q 7 8 14 0" stroke="#b3372a" stroke-width="2" fill="none" stroke-linecap="round"/></g><text x="170" y="220" font-size="14.5" font-weight="700" fill="#3b6d11" text-anchor="middle">thumb on the BACK</text>
  <text x="170" y="238" font-size="13.5" font-weight="600" fill="#3b6d11" text-anchor="middle">fingers drop straight down</text>
  <text x="470" y="220" font-size="14.5" font-weight="700" fill="#b3372a" text-anchor="middle">thumb hooked OVER</text>
  <text x="470" y="238" font-size="13.5" font-weight="600" fill="#b3372a" text-anchor="middle">flat fingers, muted strings</text>
  <text x="320" y="262" font-size="14" fill="#5e5e58" text-anchor="middle" font-weight="600">the neck seen end-on: fretboard on top, thumb pad flat on the back</text>
  </svg>
