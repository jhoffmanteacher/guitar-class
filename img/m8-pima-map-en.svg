<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="976" viewBox="0 0 640 244" font-family="Calibri,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<rect width="640" height="244" fill="#ffffff"/>
