<svg font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif" viewBox="0 0 640 258" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Notes climb like an uneven staircase: E to F and B to C are one fret apart, all other neighbors are two frets apart">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <path d="M30 220 L100 220 L100 204 L170 204 L170 172 L240 172 L240 140 L310 140 L310 108 L380 108 L380 92 L450 92 L450 60 L520 60 L520 28 L600 28" fill="none" stroke="#2f2c28" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M100 220 L100 204" stroke="#b3372a" stroke-width="5" stroke-linecap="round"/>
  <path d="M380 108 L380 92" stroke="#b3372a" stroke-width="5" stroke-linecap="round"/>
  <g font-size="24" font-weight="700" fill="#1a1a18" text-anchor="middle">
  <text x="65" y="212">E</text><text x="135" y="196">F</text><text x="205" y="164">G</text><text x="275" y="132">A</text>
  <text x="345" y="100">B</text><text x="415" y="84">C</text><text x="485" y="52">D</text><text x="560" y="20">E</text>
  </g>
  <g font-size="13.5" font-weight="600" fill="#b3372a">
  <text x="108" y="238">1 fret</text><text x="388" y="126">1 fret</text>
  </g>
  <text x="248" y="196" font-size="13.5" fill="#5e5e58">2 frets each</text>
  <path d="M240 190 q -12 -8 -14 -16" fill="none" stroke="#c9c2b4" stroke-width="1.6"/>
  <text x="600" y="130" font-size="13.5" fill="#3b6d11" font-weight="600" text-anchor="end">fret 12 = E again,</text>
  <text x="600" y="148" font-size="13.5" fill="#3b6d11" font-weight="600" text-anchor="end">one octave up</text>
  <text x="320" y="256" font-size="15" fill="#5e5e58" text-anchor="middle" font-weight="600">B→C and E→F are next-door frets — every other neighbor skips one</text>
  </svg>
