<svg font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif" viewBox="0 0 640 215" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The musical alphabet A through G repeats: after G comes A again">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <ellipse cx="320" cy="106" rx="200" ry="60" fill="none" stroke="#c9c2b4" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
  <g font-size="30" font-weight="700" fill="#1a1a18" text-anchor="middle" style="paint-order:stroke" stroke="#fffdf6" stroke-width="10" stroke-linejoin="round">
  <text x="320" y="56">A</text><text x="476" y="79">B</text><text x="515" y="129">C</text><text x="407" y="176">D</text>
  <text x="233" y="176">E</text><text x="125" y="129">F</text><text x="164" y="79">G</text>
  </g>
  <path d="M 178 56 Q 235 24 288 42" fill="none" stroke="#b3372a" stroke-width="4" stroke-linecap="round"/>
  <path d="M288 42 l -15 -8 m 15 8 l -16 6" stroke="#b3372a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="122" y="26" font-size="15" font-weight="600" fill="#b3372a">after G, start over at A</text>
  <text x="320" y="210" font-size="15" fill="#5e5e58" text-anchor="middle" font-weight="600">the musical alphabet is only A–G — no H, it just repeats</text>
  </svg>
