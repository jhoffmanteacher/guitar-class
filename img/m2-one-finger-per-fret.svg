<svg font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif" viewBox="0 0 640 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One finger per fret: index presses fret 1, middle fret 2, ring fret 3, pinky fret 4">
