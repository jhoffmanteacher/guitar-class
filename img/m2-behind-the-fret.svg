<svg font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif" viewBox="0 0 640 235" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Press just behind the fret for a clean note; too far back buzzes, on top of the wire mutes">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="20" y="150" width="600" height="42" rx="4" fill="#fffdf8" stroke="#2f2c28" stroke-width="2"/>
  <g fill="#f0eee6" stroke="#2f2c28" stroke-width="2">
  <rect x="176" y="126" width="9" height="26" rx="4.5"/>
  <rect x="396" y="126" width="9" height="26" rx="4.5"/>
  <rect x="576" y="126" width="9" height="26" rx="4.5"/>
  </g>
  <path d="M20 124 H 620" stroke="#2f2c28" stroke-width="3" stroke-linecap="round"/>
  <text x="24" y="112" font-size="13.5" fill="#5e5e58">← nut</text>
  <!-- too far back -->
  <rect x="105" y="56" width="26" height="70" rx="13" fill="#fff" stroke="#b3372a" stroke-width="2.4"/>
  <text x="118" y="44" font-size="24" font-weight="700" fill="#b3372a" text-anchor="middle">✗</text>
  <path d="M138 118 q 8 -10 16 0 q 8 10 16 0" stroke="#b3372a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <text x="118" y="216" font-size="14" font-weight="600" fill="#b3372a" text-anchor="middle">too far back = buzz</text>
  <!-- just behind the fret -->
  <rect x="359" y="56" width="26" height="70" rx="13" fill="#e6f1fb" stroke="#185fa5" stroke-width="2.6"/>
  <text x="372" y="44" font-size="26" font-weight="700" fill="#3b6d11" text-anchor="middle">✓</text>
  <text x="372" y="216" font-size="14.5" font-weight="700" fill="#3b6d11" text-anchor="middle">just behind the fret = clean</text>
  <!-- on the wire -->
  <rect x="567" y="56" width="26" height="70" rx="13" fill="#fff" stroke="#b3372a" stroke-width="2.4"/>
  <text x="580" y="44" font-size="24" font-weight="700" fill="#b3372a" text-anchor="middle">✗</text>
  <text x="566" y="216" font-size="14" font-weight="600" fill="#b3372a" text-anchor="middle">on the wire = muted</text>
  </svg>
