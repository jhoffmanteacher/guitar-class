<svg font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif" viewBox="0 0 640 195" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Draw a shuffled slip showing fret 7, say the note E within 3 seconds">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g stroke="#2f2c28" stroke-width="2.2" fill="#fff">
  <rect x="52" y="72" width="72" height="50" rx="5" transform="rotate(-7 88 97)"/>
  <rect x="72" y="62" width="72" height="50" rx="5" transform="rotate(4 108 87)"/>
  </g>
  <text x="110" y="95" font-size="22" fill="#9a9a91" text-anchor="middle" transform="rotate(4 108 87)">?</text>
  <text x="108" y="152" font-size="14.5" fill="#1a1a18" text-anchor="middle" font-weight="600">shuffled slips 0–12</text>
  <path d="M188 92 h 26 m -9 -8 l 10 8 l -10 8" stroke="#854f0b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="256" y="52" width="86" height="62" rx="6" fill="#fff" stroke="#2f2c28" stroke-width="2.6"/>
  <text x="299" y="96" font-size="36" font-weight="700" fill="#1a1a18" text-anchor="middle">7</text>
  <text x="299" y="152" font-size="14.5" fill="#1a1a18" text-anchor="middle" font-weight="600">draw one — A string, fret 7</text>
  <path d="M376 92 h 26 m -9 -8 l 10 8 l -10 8" stroke="#854f0b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="472" y="98" font-size="34" font-weight="700" fill="#3b6d11" text-anchor="middle" font-family="Georgia,serif">“E!”</text>
  <g transform="translate(537,54) scale(2.45)" fill="none" stroke="#b3372a" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5 13a7 7 0 1 0 14 0a7 7 0 0 0 -14 0"/><path d="M14.5 10.5l-2.5 2.5"/><path d="M17 8l1 -1"/><path d="M14 3h-4"/>
  </g>
  <text x="520" y="152" font-size="14.5" fill="#b3372a" text-anchor="middle" font-weight="600">say it within 3 seconds</text>
  <text x="320" y="186" font-size="15" fill="#5e5e58" text-anchor="middle" font-weight="600">no chart, no counting up from A — that’s what “knowing the notes” means</text>
  </svg>
