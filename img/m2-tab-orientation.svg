<svg font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif" viewBox="0 0 640 215" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="In TAB the top line is the thinnest string, high e; the bottom line is the thickest, low E">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="52" y="80" font-size="17" font-weight="700" fill="#5e5e58" text-anchor="middle">T</text>
  <text x="52" y="105" font-size="17" font-weight="700" fill="#5e5e58" text-anchor="middle">A</text>
  <text x="52" y="130" font-size="17" font-weight="700" fill="#5e5e58" text-anchor="middle">B</text>
  <g stroke-linecap="round">
  <path d="M80 45 H 500" stroke="#185fa5" stroke-width="2.6"/>
  <path d="M80 70 H 500" stroke="#8a8478" stroke-width="1.4"/>
  <path d="M80 95 H 500" stroke="#8a8478" stroke-width="1.4"/>
  <path d="M80 120 H 500" stroke="#8a8478" stroke-width="1.4"/>
  <path d="M80 145 H 500" stroke="#8a8478" stroke-width="1.4"/>
  <path d="M80 170 H 500" stroke="#2f2c28" stroke-width="3"/>
  </g>
  <g font-size="15" fill="#5e5e58">
  <text x="512" y="50" fill="#185fa5" font-weight="700">high e — thinnest</text>
  <text x="512" y="75">B</text><text x="512" y="100">G</text><text x="512" y="125">D</text><text x="512" y="150">A</text>
  <text x="512" y="175" fill="#2f2c28" font-weight="700">low E — thickest</text>
  </g>
  <g fill="#fffdf6"><rect x="140" y="36" width="20" height="18" rx="3"/><rect x="240" y="111" width="20" height="18" rx="3"/><rect x="340" y="161" width="20" height="18" rx="3"/></g>
  <g font-size="15" font-weight="700" fill="#1a1a18" text-anchor="middle" font-family="monospace">
  <text x="150" y="50">0</text><text x="250" y="125">3</text><text x="350" y="175">5</text>
  </g>
  <path d="M118 45 q -20 -18 -30 -22" fill="none" stroke="#185fa5" stroke-width="2" stroke-linecap="round"/>
  <text x="94" y="16" font-size="15.5" font-weight="700" fill="#185fa5">the TOP line is the THINNEST string</text>
  <text x="320" y="207" font-size="15" fill="#5e5e58" text-anchor="middle" font-weight="600">feels upside-down at first — tilt your guitar up toward your face and it matches</text>
  </svg>
