<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Tour — Beginning Guitar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--bg2:#faf9f5;--bg3:#f0eee6;
  --text:#1a1a18;--text2:#5e5e58;
  --border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.16);
  --blue-bg:#e6f1fb;--blue-text:#185fa5;
  --green-bg:#eaf3de;--green-text:#3b6d11;
  --amber-bg:#faeeda;--amber-text:#854f0b;
  --brand:#514a7d;--brand-text:#fff;--brand-hover:#5d5590;
  --radius:10px;--radius-sm:6px;
  --shadow:0 1px 5px rgba(30,27,70,0.07);
  --font-display:'Fraunces',ui-serif,Georgia,serif;
  --font-body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--bg2);color:var(--text);line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
.hdr{background:var(--brand);color:var(--brand-text);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr-title{font-family:var(--font-display);font-size:1.15rem;font-weight:600}
.hdr-sub{font-size:.78rem;opacity:.82;margin-top:2px}
.btn-lang{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:7px 16px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-lang:hover{background:rgba(255,255,255,.24)}
.dots{display:flex;gap:7px;justify-content:center;padding:16px 12px 4px;flex-wrap:wrap}
.dot{width:11px;height:11px;border-radius:50%;background:var(--bg3);border:1.5px solid var(--border2);cursor:pointer;padding:0;transition:transform .15s}
.dot.seen{background:#c5c0ee;border-color:#a89fe0}
.dot.cur{background:var(--brand);border-color:var(--brand);transform:scale(1.35)}
.step-count{text-align:center;font-size:.78rem;color:var(--text2);padding-bottom:4px}
.stage{flex:1;max-width:720px;width:100%;margin:0 auto;padding:8px 18px 24px}
.slide{display:none;animation:fadeUp .3s ease}
.slide.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}.dot{transition:none}}
.slide h2{font-family:var(--font-display);font-size:1.5rem;font-weight:700;color:var(--brand);margin-bottom:8px}
.slide .lede{font-size:.98rem;margin-bottom:14px}
.slide .lede b{color:var(--brand)}
.look{display:flex;align-items:flex-start;gap:8px;background:var(--blue-bg);color:var(--blue-text);border-radius:var(--radius-sm);padding:10px 13px;font-size:.9rem;font-weight:500;margin-bottom:14px}
.look svg{flex:none;width:18px;height:18px;margin-top:1px}
.shotwrap{background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:14px;text-align:center}
.shot{max-width:100%;height:auto;border-radius:var(--radius-sm);border:1px solid var(--border)}
.shot.narrow{max-width:280px}
.shot.mid{max-width:420px}
.cap{font-size:.78rem;color:var(--text2);margin-top:8px;text-align:center}
.q{margin-bottom:18px}
.q-text{font-weight:600;font-size:.95rem;margin-bottom:8px}
.q-opt{display:block;width:100%;text-align:left;padding:9px 13px;margin-bottom:6px;border:1.5px solid var(--border2);border-radius:var(--radius-sm);background:#fff;font-family:inherit;font-size:.88rem;cursor:pointer}
.q-opt:hover{border-color:var(--brand)}
.q-opt.right{background:var(--green-bg);border-color:var(--green-text);color:var(--green-text);font-weight:600}
.q-opt.wrong{background:var(--amber-bg);border-color:var(--amber-text);color:var(--amber-text)}
.q-fb{font-size:.83rem;margin-top:2px;min-height:1.2em;font-weight:500}
.q-fb.ok{color:var(--green-text)}
.q-fb.no{color:var(--amber-text)}
.navbar{display:flex;justify-content:space-between;gap:10px;max-width:720px;width:100%;margin:0 auto;padding:0 18px 26px}
.nbtn{padding:11px 22px;border-radius:22px;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border2);background:#fff;color:var(--text)}
.nbtn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.nbtn.primary:hover{background:var(--brand-hover)}
.nbtn:disabled{opacity:.35;cursor:default}
.finish-big{text-align:center;padding:30px 10px}
.finish-big .emoji{font-size:3rem}
.finish-big h2{margin-top:10px}
button:focus-visible,.dot:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>

<header class="hdr">
  <div>
    <div class="hdr-title" data-t="hdrTitle">Website Tour</div>
    <div class="hdr-sub">Sequoia High School — Beginning Guitar</div>
  </div>
  <button type="button" class="btn-lang" id="langBtn" onclick="toggleLang()">Español</button>
</header>

<div class="dots" id="dots" role="tablist" aria-label="Tour steps"></div>
<div class="step-count" id="stepCount"></div>

<main class="stage">

<!-- 0 Welcome -->
<section class="slide" data-slide>
  <h2 data-t="s0h"></h2>
  <p class="lede" data-t="s0p"></p>
  <div class="shotwrap"><img class="shot " src="tour-img/overview.webp" alt="" data-alt="overview"><p class="cap" data-t="cap0"></p></div>
</section>

<!-- 1 Sign in -->
<section class="slide" data-slide>
  <h2 data-t="s1h"></h2>
  <p class="lede" data-t="s1p"></p>
  <div class="shotwrap"><img class="shot " src="tour-img/signin.webp" alt="" data-alt="signin"><p class="cap" data-t="cap1"></p></div>
</section>

<!-- 2 Modules & locks -->
<section class="slide" data-slide>
  <h2 data-t="s2h"></h2>
  <p class="lede" data-t="s2p"></p>
  <div class="shotwrap"><img class="shot narrow" src="tour-img/modules-sets.webp" alt="" data-alt="modules-sets"><p class="cap" data-t="cap2"></p></div>
</section>

<!-- 3 This set: B → C → checklist -->
<section class="slide" data-slide>
  <h2 data-t="s3h"></h2>
  <p class="lede" data-t="s3p"></p>
  <div class="shotwrap"><img class="shot narrow" src="tour-img/this-set.webp" alt="" data-alt="this-set"><p class="cap" data-t="cap3"></p></div>
</section>

<!-- 4 Station B viewer -->
<section class="slide" data-slide>
  <h2 data-t="s4h"></h2>
  <p class="lede" data-t="s4p"></p>
  <div class="shotwrap"><img class="shot " src="tour-img/station-b.webp" alt="" data-alt="station-b"><p class="cap" data-t="cap4"></p></div>
</section>

<!-- 5 Listening Coach -->
<section class="slide" data-slide>
  <h2 data-t="s5h"></h2>
  <p class="lede" data-t="s5p"></p>
  <div class="shotwrap"><img class="shot " src="tour-img/coach-button.webp" alt="" data-alt="coach-button"><p class="cap" data-t="cap5a"></p></div>
  <div class="shotwrap"><img class="shot mid" src="tour-img/coach-card.webp" alt="" data-alt="coach-card"><p class="cap" data-t="cap5b"></p></div>
</section>

<!-- 6 Checklist -->
<section class="slide" data-slide>
  <h2 data-t="s6h"></h2>
  <p class="lede" data-t="s6p"></p>
  <div class="shotwrap"><img class="shot " src="tour-img/checklist.webp" alt="" data-alt="checklist"><p class="cap" data-t="cap6"></p></div>
</section>

<!-- 7 Songs -->
<section class="slide" data-slide>
  <h2 data-t="s7h"></h2>
  <p class="lede" data-t="s7p"></p>
  <div class="shotwrap"><img class="shot " src="tour-img/songs.webp" alt="" data-alt="songs"><p class="cap" data-t="cap7"></p></div>
</section>

<!-- 8 Explore -->
<section class="slide" data-slide>
  <h2 data-t="s8h"></h2>
  <p class="lede" data-t="s8p"></p>
  <div class="shotwrap"><img class="shot narrow" src="tour-img/explore.webp" alt="" data-alt="explore"><p class="cap" data-t="cap8"></p></div>
</section>

<!-- 9 Tools -->
<section class="slide" data-slide>
  <h2 data-t="s9h"></h2>
  <p class="lede" data-t="s9p"></p>
  <div class="shotwrap" style="display:flex;gap:14px;justify-content:center;align-items:flex-start;flex-wrap:wrap"><img class="shot narrow" src="tour-img/tools.webp" alt="" data-alt="tools"><img class="shot narrow" src="tour-img/metronome.webp" alt="" data-alt="metronome"></div>
  <p class="cap" data-t="cap9"></p>
</section>

<!-- 10 Header: Find + Español -->
<section class="slide" data-slide>
  <h2 data-t="s10h"></h2>
  <p class="lede" data-t="s10p"></p>
  <div class="shotwrap"><img class="shot " src="tour-img/header.webp" alt="" data-alt="header"><p class="cap" data-t="cap10"></p></div>
</section>

<!-- 11 Quiz -->
<section class="slide" data-slide>
  <h2 data-t="s11h"></h2>
  <p class="lede" data-t="s11p"></p>
  <div class="q">
    <p class="q-text" data-t="q1"></p>
    <button type="button" class="q-opt" onclick="answer(this,false)" data-t="q1a"></button>
    <button type="button" class="q-opt" onclick="answer(this,true)"  data-t="q1b"></button>
    <button type="button" class="q-opt" onclick="answer(this,false)" data-t="q1c"></button>
    <p class="q-fb"></p>
  </div>
  <div class="q">
    <p class="q-text" data-t="q2"></p>
    <button type="button" class="q-opt" onclick="answer(this,true)"  data-t="q2a"></button>
    <button type="button" class="q-opt" onclick="answer(this,false)" data-t="q2b"></button>
    <button type="button" class="q-opt" onclick="answer(this,false)" data-t="q2c"></button>
    <p class="q-fb"></p>
  </div>
  <div class="q">
    <p class="q-text" data-t="q3"></p>
    <button type="button" class="q-opt" onclick="answer(this,false)" data-t="q3a"></button>
    <button type="button" class="q-opt" onclick="answer(this,true)"  data-t="q3b"></button>
    <button type="button" class="q-opt" onclick="answer(this,false)" data-t="q3c"></button>
    <p class="q-fb"></p>
  </div>
  <div class="q">
    <p class="q-text" data-t="q4"></p>
    <button type="button" class="q-opt" onclick="answer(this,false)" data-t="q4a"></button>
    <button type="button" class="q-opt" onclick="answer(this,false)" data-t="q4b"></button>
    <button type="button" class="q-opt" onclick="answer(this,true)"  data-t="q4c"></button>
    <p class="q-fb"></p>
  </div>
</section>

<!-- 12 Done -->
<section class="slide" data-slide>
  <div class="finish-big">
    <div class="emoji">🎸</div>
    <h2 data-t="s12h"></h2>
    <p class="lede" style="margin-top:8px" data-t="s12p"></p>
  </div>
</section>

</main>

<nav class="navbar">
  <button type="button" class="nbtn" id="backBtn" onclick="go(-1)" data-t="back"></button>
  <button type="button" class="nbtn primary" id="nextBtn" onclick="go(1)" data-t="next"></button>
</nav>

<script>
const STR = {
  alt_overview:{en:"The guitar class website after signing in: gray menu on the left, current set in the middle.",es:"El sitio web de la clase de guitarra al iniciar sesión: menú gris a la izquierda, unidad actual en el centro."},
  alt_signin:{en:"The sign-in screen with the Sign in with Google button.",es:"La pantalla de inicio de sesión con el botón Iniciar sesión con Google."},
  alt_modules_sets:{en:"The Module section of the menu: a module dropdown, Set 1 open, Set 2 and Module review locked.",es:"La sección Módulo del menú: un menú desplegable, la Unidad 1 abierta, la Unidad 2 y el Repaso del módulo bloqueados."},
  alt_this_set:{en:"The This set section of the menu with three buttons: Station B, Station C, and My skills checklist.",es:"La sección Esta unidad del menú con tres botones: Estación B, Estación C y Mi lista de destrezas."},
  alt_station_b:{en:"A Station B set showing Step 1 of 5, the step text, a Hint fold, and the Next button.",es:"Una unidad de la Estación B mostrando el Paso 1 de 5, el texto del paso, una Pista y el botón Siguiente."},
  alt_coach_button:{en:"A challenge step with a Listening Coach button next to the Play button.",es:"Un paso de reto con un botón de Entrenador de Escucha junto al botón de Reproducir."},
  alt_coach_card:{en:"The Listening Coach card showing the notes you will play and a Start the check button.",es:"La tarjeta del Entrenador de Escucha mostrando las notas que vas a tocar y un botón de Empezar el chequeo."},
  alt_checklist:{en:"The skills checklist with two columns per skill: Still working on it, and I have got it.",es:"La lista de destrezas con dos columnas por destreza: Todavía lo estoy practicando, y Ya lo tengo."},
  alt_songs:{en:"The Songs library showing Core songs and the Choice menu.",es:"La biblioteca de Canciones mostrando las canciones centrales y el menú de elección."},
  alt_explore:{en:"The Explore section of the menu: In-Class Activities, Practice, Games, Songs, Keep practicing, Daily Review, My progress.",es:"La sección Explorar del menú: Actividades de clase, Practicar, Juegos, Canciones, Sigue practicando, Repaso del día, Mi progreso."},
  alt_tools:{en:"The four practice tools at the bottom of the menu: Tuner, Timer, Metronome, Recorder.",es:"Las cuatro herramientas de práctica al fondo del menú: Afinador, Temporizador, Metrónomo, Grabadora."},
  alt_metronome:{en:"The Metronome tool opened, showing BPM and tempo controls.",es:"La herramienta Metrónomo abierta, mostrando BPM y controles de tempo."},
  alt_header:{en:"The purple site header with the Find button, the Español button, and your account.",es:"La barra morada del sitio con el botón Buscar, el botón Español y tu cuenta."},
  hdrTitle:{en:'Website Tour',es:'Recorrido del sitio web'},
  back:{en:'\u2190 Back',es:'\u2190 Atr\u00e1s'}, next:{en:'Next \u2192',es:'Siguiente \u2192'},
  finish:{en:'Start over',es:'Empezar de nuevo'},
  stepOf:{en:'Step {a} of {b}',es:'Paso {a} de {b}'},

  s0h:{en:'Welcome! This is your practice home.',es:'\u00a1Bienvenido! Este es tu espacio de pr\u00e1ctica.'},
  s0p:{en:'In guitar class you\u2019ll rotate through three stations. This website runs <b>Station B</b> (learn with videos) and <b>Station C</b> (practice on your own) \u2014 and it remembers everything you can do. Here\u2019s the whole site right after you sign in: gray menu on the left, your work in the middle.',
       es:'En la clase de guitarra vas a rotar por tres estaciones. Este sitio web es la <b>Estaci\u00f3n B</b> (aprende con videos) y la <b>Estaci\u00f3n C</b> (practica por tu cuenta) \u2014 y recuerda todo lo que ya sabes hacer. As\u00ed se ve el sitio completo al iniciar sesi\u00f3n: men\u00fa gris a la izquierda, tu trabajo en el centro.'},
  cap0:{en:'The real site \u2014 menu on the left, your current set in the middle.',es:'El sitio real \u2014 men\u00fa a la izquierda, tu unidad actual en el centro.'},

  s1h:{en:'Step 1: Sign in with your school Google account',es:'Paso 1: Inicia sesi\u00f3n con tu cuenta Google de la escuela'},
  s1p:{en:'This is the first screen you\u2019ll see. Use your <b>school</b> Google account. After that, everything you mark saves automatically \u2014 on any Chromebook, any day. You never lose your progress.',
       es:'Esta es la primera pantalla que ver\u00e1s. Usa tu cuenta Google <b>de la escuela</b>. Despu\u00e9s de eso, todo lo que marques se guarda autom\u00e1ticamente \u2014 en cualquier Chromebook, cualquier d\u00eda. Nunca pierdes tu progreso.'},
  cap1:{en:'The sign-in screen.',es:'La pantalla de inicio de sesi\u00f3n.'},

  s2h:{en:'Modules and sets \u2014 finish one to unlock the next',es:'M\u00f3dulos y unidades \u2014 termina una para desbloquear la siguiente'},
  s2p:{en:'The course is split into <b>modules</b> (big topics) \u2014 pick one from the dropdown at the top of the menu. Each module has <b>sets</b>, the pills underneath. Sets unlock <b>in order</b>: the lock icon means \u201cfinish the set before this one first.\u201d Mark every skill in Set 1 and Set 2 opens.',
       es:'El curso se divide en <b>m\u00f3dulos</b> (temas grandes) \u2014 elige uno en el men\u00fa desplegable arriba. Cada m\u00f3dulo tiene <b>unidades</b>, las p\u00edldoras de abajo. Las unidades se desbloquean <b>en orden</b>: el candado significa \u201cprimero termina la unidad anterior\u201d. Marca todas las destrezas de la Unidad 1 y la Unidad 2 se abre.'},
  cap2:{en:'Set 1 is open; Set 2 and the Module review are locked until you finish it.',es:'La Unidad 1 est\u00e1 abierta; la Unidad 2 y el Repaso del m\u00f3dulo est\u00e1n bloqueados hasta que la termines.'},

  s3h:{en:'Every set has three stops, in the menu: B \u2192 C \u2192 checklist',es:'Cada unidad tiene tres paradas, en el men\u00fa: B \u2192 C \u2192 lista'},
  s3p:{en:'Under \u201cThis set\u201d in the menu you\u2019ll always find the same three buttons. That\u2019s your path every time: learn it at <b>Station B</b>, drill it at <b>Station C</b>, then mark what you can do on <b>My skills checklist</b>.',
       es:'Bajo \u201cEsta unidad\u201d en el men\u00fa siempre encontrar\u00e1s los mismos tres botones. Ese es tu camino siempre: apr\u00e9ndelo en la <b>Estaci\u00f3n B</b>, pract\u00edcalo en la <b>Estaci\u00f3n C</b>, y luego marca lo que ya sabes hacer en <b>Mi lista de destrezas</b>.'},
  cap3:{en:'The \u201cThis set\u201d buttons \u2014 tap them to move between B, C, and your checklist.',es:'Los botones de \u201cEsta unidad\u201d \u2014 t\u00f3calos para moverte entre B, C y tu lista.'},

  s4h:{en:'Inside Station B: one step at a time',es:'Dentro de la Estaci\u00f3n B: un paso a la vez'},
  s4p:{en:'Station B shows you <b>one step at a time</b> \u2014 \u201cStep 1 of 5.\u201d Read it, do it on your guitar, then press <b>Next</b>: the site checks the step off and opens the next one. Come back tomorrow and it reopens right where you left off. Stuck? Open the <b>Hint</b> before you raise your hand. Want the full list? Tap <b>All steps</b>.',
       es:'La Estaci\u00f3n B te muestra <b>un paso a la vez</b> \u2014 \u201cPaso 1 de 5\u201d. L\u00e9elo, hazlo en tu guitarra, y presiona <b>Siguiente</b>: el sitio marca el paso y abre el que sigue. Regresa ma\u00f1ana y se abre justo donde te quedaste. \u00bfAtorado? Abre la <b>Pista</b> antes de levantar la mano. \u00bfQuieres ver toda la lista? Toca <b>Todos los pasos</b>.'},
  cap4:{en:'A Station B set: the step counter, the current step, its Hint, and the Next button.',es:'Una unidad en la Estaci\u00f3n B: el contador de pasos, el paso actual, su Pista y el bot\u00f3n Siguiente.'},

  s5h:{en:'The Listening Coach: it hears you play',es:'El Entrenador de Escucha: te escucha tocar'},
  s5p:{en:'Some steps and challenges have a <b>Listening Coach</b> button. Tap it and the site <b>listens through your mic</b> while you play: you get 4 count-in clicks, then play one note or strum per beat, and it tells you which ones were clean. It works best somewhere quiet with the guitar close to the mic \u2014 and it\u2019s practice feedback just for you, not a grade.',
       es:'Algunos pasos y retos tienen un bot\u00f3n de <b>Entrenador de Escucha</b>. T\u00f3calo y el sitio <b>te escucha por el micr\u00f3fono</b> mientras tocas: oyes 4 clics de cuenta, luego tocas una nota o un rasgueo por tiempo, y te dice cu\u00e1les salieron limpios. Funciona mejor en un lugar tranquilo con la guitarra cerca del micr\u00f3fono \u2014 y es retroalimentaci\u00f3n de pr\u00e1ctica solo para ti, no una calificaci\u00f3n.'},
  cap5a:{en:'The Coach button lives right on the step, next to \u25b6 Play.',es:'El bot\u00f3n del Entrenador est\u00e1 en el mismo paso, junto a \u25b6 Reproducir.'},
  cap5b:{en:'The Coach ready screen: it shows what you\u2019ll play, then Start the check.',es:'La pantalla del Entrenador: muestra lo que vas a tocar, y luego Empezar el chequeo.'},

  s6h:{en:'My skills checklist: be honest, then celebrate',es:'Mi lista de destrezas: s\u00e9 honesto, y luego celebra'},
  s6p:{en:'This is the most important screen. For each skill, choose <b>Still working on it</b> while you\u2019re learning, then <b>I\u2019ve got it!</b> once you can do it consistently. The line under each skill tells you exactly what \u201cgot it\u201d means \u2014 no guessing. Mark every skill in the set and the next set unlocks.',
       es:'Esta es la pantalla m\u00e1s importante. Para cada destreza, elige <b>Todav\u00eda lo estoy practicando</b> mientras aprendes, y luego <b>\u00a1Ya lo tengo!</b> cuando puedas hacerlo de forma consistente. La l\u00ednea debajo de cada destreza te dice exactamente qu\u00e9 significa \u201cya lo tengo\u201d \u2014 sin adivinar. Marca todas las destrezas de la unidad y la siguiente se desbloquea.'},
  cap6:{en:'The checklist: two columns per skill \u2014 Still working on it, and I\u2019ve got it!',es:'La lista: dos columnas por destreza \u2014 Todav\u00eda lo estoy practicando, y \u00a1Ya lo tengo!'},

  s7h:{en:'Songs: real music from day one',es:'Canciones: m\u00fasica de verdad desde el primer d\u00eda'},
  s7p:{en:'Tap <b>Songs</b> in the menu to open the whole library. <b>Core songs</b> \u2014 like Seven Nation Army and Luna \u2014 grow with you all year: each has a <b>Song Journey</b> page where you add a new layer (notes \u2192 power chords \u2192 solos \u2192 chords) as you learn. The <b>Choice menu</b> is yours to explore \u2014 pick what you like.',
       es:'Toca <b>Canciones</b> en el men\u00fa para abrir toda la biblioteca. Las <b>canciones centrales</b> \u2014 como Seven Nation Army y Luna \u2014 crecen contigo todo el a\u00f1o: cada una tiene una p\u00e1gina de <b>Song Journey</b> donde agregas una nueva capa (notas \u2192 power chords \u2192 solos \u2192 acordes) mientras aprendes. El <b>men\u00fa de elecci\u00f3n</b> es tuyo para explorar \u2014 escoge lo que te guste.'},

       es:'Fijas al fondo del men\u00fa: un <b>Afinador</b> (usa tu micr\u00f3fono \u2014 afina al inicio de cada clase), un <b>Temporizador</b>, un <b>Metr\u00f3nomo</b> para mantener el pulso constante, y una <b>Grabadora</b> para escucharte a ti mismo.'},

let lang = 'en';
function t(k, vars){
  let s = (STR[k] && STR[k][lang]) || (STR[k] && STR[k].en) || k;
  if(vars) for(const v in vars) s = s.replace('{'+v+'}', vars[v]);
  return s;
}
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el=>{
    const k = el.getAttribute('data-t');
    if(!STR[k]) return;
    if(/</.test(STR[k].en)) el.innerHTML = t(k);
    else el.textContent = t(k);
  });
  document.querySelectorAll('img[data-alt]').forEach(im=>{
    const k = 'alt_' + im.getAttribute('data-alt').replace(/-/g,'_');
    if(STR[k]) im.alt = t(k);
  });
  document.getElementById('langBtn').textContent = (lang==='en') ? 'Espa\u00f1ol' : 'English';
  updateNav();
}
function toggleLang(){ lang = (lang==='en') ? 'es' : 'en'; applyLang(); }

const slides = Array.from(document.querySelectorAll('[data-slide]'));
const dotsEl = document.getElementById('dots');
let cur = 0;
slides.forEach((s,i)=>{
  const d = document.createElement('button');
  d.className='dot'; d.type='button';
  d.setAttribute('aria-label','Step '+(i+1));
  d.onclick=()=>show(i);
  dotsEl.appendChild(d);
});
const dots = Array.from(dotsEl.children);
function show(i){
  cur = Math.max(0, Math.min(slides.length-1, i));
  slides.forEach((s,j)=>s.classList.toggle('active', j===cur));
  dots.forEach((d,j)=>{ d.classList.toggle('cur', j===cur); d.classList.toggle('seen', j<cur); });
  updateNav();
  window.scrollTo({top:0, behavior:'auto'});
}
function updateNav(){
  document.getElementById('backBtn').disabled = (cur===0);
  const next = document.getElementById('nextBtn');
  next.textContent = (cur===slides.length-1) ? t('finish') : t('next');
  document.getElementById('stepCount').textContent = t('stepOf',{a:cur+1,b:slides.length});
}
function go(dir){
  if(dir===1 && cur===slides.length-1){ show(0); return; }
  show(cur+dir);
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') go(1);
  if(e.key==='ArrowLeft') go(-1);
});
function answer(btn, right){
  const q = btn.closest('.q');
  q.querySelectorAll('.q-opt').forEach(o=>o.classList.remove('right','wrong'));
  btn.classList.add(right?'right':'wrong');
  const fb = q.querySelector('.q-fb');
  fb.textContent = t(right?'fbOk':'fbNo');
  fb.className = 'q-fb ' + (right?'ok':'no');
}
applyLang();
show(0);
</script>
