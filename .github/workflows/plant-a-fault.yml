# Plant a fault: once a week GitHub plants small mistakes in the risky code, one at a time, and lists any
# that no tool caught (Jonathan's plan, Wave 3 item 2, 2026-11-14). tools/plant-a-fault.mjs does the work;
# its header says how. REPORT-ONLY: a mistake that got through never turns the run red. A job is red only
# when its region's tools already fail on the UNMUTATED code (checked first, every run), when a tool cannot
# be started, or when the tool itself breaks: then the weekly answer means nothing until that is fixed.
#
# Reading it: Actions -> Plant a fault -> the run. Each job's summary page holds its report ("Planted N small
# mistakes in the risky code; the tools caught M. K got through and are new this week: ..."), and its one-line
# result is a notice on the run page (tools/ci/run-and-annotate.mjs). A clean week reads "Nothing new got
# through". Each mistake that got through has a replay command: run it on the Mac to plant that one mistake in
# a scratch copy and see what each tool says. Judged harmless (or accepted) -> one entry in
# tools/plant-a-fault-known.json; a real gap -> a test in the tool that should have caught it.
#
# One job per region, side by side, so no job passes about 40 minutes: the six Node regions, and the rules on
# the Firestore emulator (the same install as rules.yml). Each job stops planting at --budget minutes and says
# how many it did not plant. The browser tools (update-reload-loop, slow-load, smoke, playalong-loop) are NOT
# run here; the report names them as not exercised.
#
# When: Tuesdays 10:23 UTC = Tuesday 2:23 AM PST (winter) and 3:23 AM PDT (summer). Cron is UTC and ignores
# daylight saving. A quiet hour: nobody pushes then, it is nowhere near the Friday evening full walk
# (browser.yml, Saturday 03:37 UTC) or the Friday check (Fridays 11 PM Pacific), and off the hour on purpose
# (GitHub's advice: the top of the hour is when scheduled runs queue longest). Scheduled runs use main's tip.
# Manual run: Actions -> Plant a fault -> Run workflow, with a seed (empty = this ISO week, e.g. 2026-W46: the
# same seed and code plant the same mistakes) and one region (empty = all).
#
# Actions are pinned to the same SHAs as checks.yml (checkout, setup-node, Node 24); the rules job adds
# rules.yml's setup-java and cache steps and its exact package versions.
name: Plant a fault

on:
  schedule:
    - cron: '23 10 * * 2'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed (empty = this ISO week, e.g. 2026-W46)'
        type: string
        default: ''
      region:
        description: 'Only this region (save, cache, rules, listening, signin, songfiles, console-config; empty = all)'
        type: string
        default: ''
      per_region:
        description: "Mistakes per region (empty = each region's own number, in the matrix below)"
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: plant-a-fault-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node:
    name: plant (${{ matrix.region }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # count: mistakes per week, sized from the first run's minutes per mistake (2026-11-14, the Mac) so a job
        # plants them all inside --budget; listening's tools are the slowest (about 4.4 worker-minutes a mistake).
        include:
          - { region: save, count: 20 }
          - { region: cache, count: 20 }
          - { region: listening, count: 12 }
          - { region: signin, count: 20 }
          - { region: songfiles, count: 30 }
          - { region: console-config, count: 12 }
    env:
      REGION: ${{ matrix.region }}
      ONLY: ${{ inputs.region }}
      SEED_IN: ${{ inputs.seed }}
      PER_REGION: ${{ inputs.per_region || matrix.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Plant small mistakes, one at a time (tools/plant-a-fault.mjs)
        run: |
          if [ -n "$ONLY" ] && [ "$ONLY" != "$REGION" ]; then echo "Only $ONLY was asked for: $REGION not run."; exit 0; fi
          SEED="${SEED_IN:-$(date -u +%G-W%V)}"
          node tools/ci/run-and-annotate.mjs --title "Plant a fault: $REGION" --log "$RUNNER_TEMP/plant-a-fault.log" \
            --summary 'plant-a-fault: [0-9]+ planted' --deadline 41 -- \
            node tools/plant-a-fault.mjs --region "$REGION" --seed "$SEED" --per-region "$PER_REGION" --jobs 2 --budget 34 --max-load 16 \
              --json "$RUNNER_TEMP/plant-a-fault.json"
      - name: Keep the full result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plant-a-fault-${{ matrix.region }}
          path: |
            ${{ runner.temp }}/plant-a-fault.json
            ${{ runner.temp }}/plant-a-fault.log
          if-no-files-found: ignore
          retention-days: 30

  rules:
    name: plant (rules, on the emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_TOOLS_VERSION: 15.36.0
      RULES_UNIT_TESTING_VERSION: 6.0.0
      FIREBASE_JS_VERSION: 10.12.2
      ONLY: ${{ inputs.region }}
      SEED_IN: ${{ inputs.seed }}
      PER_REGION: ${{ inputs.per_region || '30' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # @firebase/rules-unit-testing 6 needs Node 24.12 or later; "24" is the newest 24.x.
          node-version: 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          java-package: jre
      - name: Cache the emulator jar and the npm download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/firebase/emulators
            ~/.npm
          key: rules-emu-${{ runner.os }}-ft${{ env.FIREBASE_TOOLS_VERSION }}-rut${{ env.RULES_UNIT_TESTING_VERSION }}-fb${{ env.FIREBASE_JS_VERSION }}
      - name: Install the emulator and the test packages (outside the checkout)
        run: |
          EMU="$RUNNER_TEMP/rules-emu"
          mkdir -p "$EMU" && cd "$EMU"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --legacy-peer-deps --save-exact \
            "firebase-tools@$FIREBASE_TOOLS_VERSION" \
            "@firebase/rules-unit-testing@$RULES_UNIT_TESTING_VERSION" \
            "firebase@$FIREBASE_JS_VERSION"
          echo '{ "firestore": { "rules": "firestore.rules" }, "emulators": { "firestore": { "port": 8089 }, "ui": { "enabled": false } } }' > firebase.json
          cp "$GITHUB_WORKSPACE/firestore.rules" .
          java -version
          npx --no-install firebase --version
      - name: Plant small mistakes in the rules, one at a time, on one emulator
        run: |
          if [ -n "$ONLY" ] && [ "$ONLY" != "rules" ]; then echo "Only $ONLY was asked for: rules not run."; exit 0; fi
          SEED="${SEED_IN:-$(date -u +%G-W%V)}"
          EMU="$RUNNER_TEMP/rules-emu"
          cd "$EMU"
          node "$GITHUB_WORKSPACE/tools/ci/run-and-annotate.mjs" --title "Plant a fault: rules" --log "$RUNNER_TEMP/plant-a-fault.log" \
            --summary 'plant-a-fault: [0-9]+ planted' --deadline 41 -- \
            npx --no-install firebase emulators:exec --only firestore --project demo-gc \
              "node $GITHUB_WORKSPACE/tools/plant-a-fault.mjs --root $GITHUB_WORKSPACE --region rules --emu $EMU --emu-port 8089 --seed $SEED --per-region $PER_REGION --jobs 2 --budget 34 --max-load 16 --json $RUNNER_TEMP/plant-a-fault.json"
      - name: Keep the full result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plant-a-fault-rules
          path: |
            ${{ runner.temp }}/plant-a-fault.json
            ${{ runner.temp }}/plant-a-fault.log
          if-no-files-found: ignore
          retention-days: 30
