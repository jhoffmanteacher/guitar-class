# Is every public file on the live site the one we pushed? (2026-11-26)
#
# After each push to main, tools/live-files.mjs waits for GitHub Pages to finish
# deploying that commit (GitHub's Deployments API), then fetches every public
# file from https://jhoffmanteacher.github.io/guitar-class/ and compares its
# bytes with the same path at the commit (the backing tracks by size and by
# sw.js's AUDIO_HASHES map, not downloaded). It fails with the list of files
# that differ or are missing, or when the deploy failed or was not done in 20
# minutes. The tool's header says which files are public and how it retries a
# CDN copy that is still catching up.
#
# Once a day it does the same for main's tip, which catches a site that went
# stale or lost a file with no push. Cron is UTC: 13:43 is 5:43 AM PST (6:43 AM
# PDT), before school; off the hour on purpose (GitHub's advice).
#
# A later push that is deployed first makes the run pass with "superseded": that
# push's own run checks the site. So no run is cancelled by a newer one.
#
# First, --self-test proves the comparison turns red (a local server with three
# planted faults; no network, seconds). Nothing here blocks a push or the Pages
# deploy (GitHub's separate "pages build and deployment" run); a red run means
# "look at the last push". `node tools/checks.mjs --live` stays the quick check
# by hand (one line, the live sw.js version).
#
# Every action is pinned to a full commit SHA, with its release in a comment.
name: Live site files

on:
  push:
    branches: [main]
  schedule:
    - cron: '43 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  live-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: live-files-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The comparison turns red on planted faults (tools/live-files.mjs --self-test)
        run: node tools/live-files.mjs --self-test
      - name: Every public file on the live site (tools/live-files.mjs)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node tools/ci/run-and-annotate.mjs --title "live site files" --log "$RUNNER_TEMP/ci-out/live-files.log" --summary '^live-files: (✓|✗)' --deadline 27 -- node tools/live-files.mjs --sha "$GITHUB_SHA" --wait 20
