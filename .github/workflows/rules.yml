# Tests firestore.rules against the REAL Firestore emulator after every push to
# main. firestore.rules guards every student's saved work (progress/{uid}) and
# the class settings (config/class); before this, its tests ran only by hand.
#
#   tools/pm-rules-test.mjs    practice minutes, the boards, the mic takes
#   tools/rules-core-test.mjs  progress, config/class, the teacher check, the
#                              live quiz, issue reports (with --breaks: broken
#                              copies of the rules, each must turn a case red)
#   tools/song-requests-rules-test.mjs  song requests: one per student per week,
#                              the week maths at its edges (with --breaks)
#   tools/song-files-rules-test.mjs  song files behind the sign-in: only the
#                              teacher writes them, the month's download
#                              counter only rises (with --breaks)
#   tools/built-songs-rules-test.mjs  built songs (the console's Song builder):
#                              a school account gets one by id and reads the
#                              list, only the teacher writes (with --breaks)
#
# Job "emu-loops" (2026-11-26): the site's own pages on the real Firebase JS
# SDK against the Auth AND Firestore emulators (tools/emu-site.mjs):
#   tools/signin-loop.mjs      who gets in and can they save: the page's school
#                              test against isSchool(), ask / allow / lock out
#                              through the console's own writers
#   tools/progress-emu-loop.mjs  the progress save on the real SDK: save-loop's
#                              fake rules checked against it; reload, second
#                              device, sign-out, offline, the 4/5 move, Start over
# Both with --plants (planted faults in in-memory copies; each must turn a case
# red). They run from the checkout; only the npm packages live outside it.
#
# Nothing here touches the real Firebase project: the emulator runs on the
# runner under a "demo-" project id, which needs no credentials and cannot
# reach the network project. No deploy step: publishing rules is still the
# Firebase console paste (CLAUDE.md, "firestore.rules change").
#
# The npm packages the tools need are NOT in the repo (no package.json). They
# are installed on the runner only, at exact versions, into a folder outside
# the checkout; each tool and firestore.rules are copied there and run from
# there, the way the tools' headers say to run them by hand. (The tools are
# ES modules, which ignore NODE_PATH, so copying is what makes the packages
# resolvable.) Each tool runs in its own emulator, so one cannot leave data
# behind for the next.
#
# It does not block a push or the Pages deploy: a red run means "look at the
# last push". A failing case is printed as an ::error annotation (the summary
# line as its title, the failing cases in the message); a passing tool prints
# its summary line as a ::notice.
#
# To add a tool: one line under RULES_TOOLS below (the file, then its
# arguments). The rules file and --port 8089 are passed to every tool.
#
# One rules text since 2026-11-14 (paste-2 day): firestore.rules, with the
# school-accounts gate isSchool() (checks.mjs 1dt). From 2026-11-13 to that
# day a second file held that paste and every tool ran on both; each tool now
# refuses a rules text without isSchool().
name: Firestore rules

on:
  push:
    branches: [main, 'ci-try/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_TOOLS_VERSION: 15.36.0
      RULES_UNIT_TESTING_VERSION: 6.0.0
      FIREBASE_JS_VERSION: 10.12.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # @firebase/rules-unit-testing 6 needs Node 24.12 or later.
          node-version: 24.16.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          java-package: jre
      - name: Cache the emulator jar and the npm download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/firebase/emulators
            ~/.npm
          key: rules-emu-${{ runner.os }}-ft${{ env.FIREBASE_TOOLS_VERSION }}-rut${{ env.RULES_UNIT_TESTING_VERSION }}-fb${{ env.FIREBASE_JS_VERSION }}
      - name: Install the emulator and the test packages (outside the checkout)
        run: |
          EMU="$RUNNER_TEMP/rules-emu"
          mkdir -p "$EMU" && cd "$EMU"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --legacy-peer-deps --save-exact \
            "firebase-tools@$FIREBASE_TOOLS_VERSION" \
            "@firebase/rules-unit-testing@$RULES_UNIT_TESTING_VERSION" \
            "firebase@$FIREBASE_JS_VERSION"
          echo '{ "firestore": { "rules": "firestore.rules" }, "emulators": { "firestore": { "port": 8089 }, "ui": { "enabled": false } } }' > firebase.json
          java -version
          npx --no-install firebase --version
      - name: Run the rules tests on the emulator
        env:
          # One line per tool: the file, then its own arguments.
          RULES_TOOLS: |
            tools/pm-rules-test.mjs
            tools/rules-core-test.mjs --breaks
            tools/site-errors-rules-test.mjs --breaks --site ${{ github.workspace }}
            tools/song-requests-rules-test.mjs --breaks
            tools/song-files-rules-test.mjs --breaks
            tools/built-songs-rules-test.mjs --breaks
        run: |
          # GitHub runs this with -e and pipefail; one tool failing must not stop the others.
          set +e +o pipefail
          EMU="$RUNNER_TEMP/rules-emu"
          # Workflow-command escaping: the message keeps only its first line unless newlines are
          # escaped; a property (the title) also needs ':' and ','.
          esc()  { printf '%s' "$1" | awk 'BEGIN { ORS = "" } { gsub(/%/, "%25"); gsub(/\r/, "%0D"); if (NR > 1) printf "%%0A"; print }'; }
          escp() { esc "$1" | awk 'BEGIN { ORS = "" } { gsub(/:/, "%3A"); gsub(/,/, "%2C"); print }'; }
          failed=0
          # (stdin of each run is /dev/null so it cannot swallow the rest of this list)
          RULES_FILES="firestore.rules"
          while read -r tool args; do
            [ -z "$tool" ] && continue
            if [ ! -f "$tool" ]; then
              echo "::error title=$(escp "$(basename "$tool")")::$(esc "$tool is listed in RULES_TOOLS in .github/workflows/rules.yml but is not in the repo.")"
              failed=1; continue
            fi
            for rules in $RULES_FILES; do
            name="$(basename "$tool") on $rules"
            log="$EMU/$(basename "$tool").$rules.log"
            echo "::group::$tool $args ($rules)"
            cp "$tool" "$rules" "$EMU/"
            ( cd "$EMU" && npx --no-install firebase emulators:exec --only firestore --project demo-gc \
                "node $(basename "$tool") $rules --port 8089 $args" ) < /dev/null > "$log" 2>&1
            code=$?
            cat "$log"
            echo "::endgroup::"
            # The summary lines each tool prints: "✓ firestore.rules: N passed, 0 failed" and, with --breaks, "✓ K of K breaks caught".
            summary="$(grep -E '^(✓|✗) .*(passed, [0-9]+ failed|breaks caught)$' "$log" | tr '\n' ' ' | sed 's/ *$//')"
            # Each failing case: its "  ✗ " line, with the reason line the tools print just above it.
            cases="$(awk '/^      / { reason = $0; next } /^  ✗ / { line = $0; sub(/^  ✗ /, "", line); sub(/^ +/, "", reason); print "✗ " line (reason != "" ? "  [" reason "]" : "") } { reason = "" }' "$log")"
            if [ "$code" -eq 0 ] && [ -n "$summary" ]; then
              echo "::notice title=$(escp "$name")::$(esc "$summary")"
            else
              failed=1
              if [ -z "$cases" ]; then
                body="exit code $code and no failing case printed: the install, the emulator or the tool itself failed. Last lines of the log:"$'\n'"$(tail -n 15 "$log")"
              else
                n="$(printf '%s\n' "$cases" | grep -c '^✗')"
                body="$n failing (first 30 shown):"$'\n'"$(printf '%s\n' "$cases" | head -n 30)"
              fi
              echo "::error title=$(escp "$name: ${summary:-no summary line}")::$(esc "$body")"
            fi
            done
          done <<< "$RULES_TOOLS"
          exit $failed

  emu-loops:
    # The site's own pages (tools/emu-site.mjs) on the real Firebase JS SDK, against the Auth and Firestore
    # emulators under the demo- project id; the tools refuse any other id and any address off this runner.
    runs-on: ubuntu-latest
    # Each tool stops itself at its --deadline (540 s) and is killed at 600 s; two tools and the install fit well
    # inside this.
    timeout-minutes: 25
    env:
      # Keep in step with the rules job above. FIREBASE_JS_VERSION must be the version index.html loads from
      # gstatic: both tools fail when it is not.
      FIREBASE_TOOLS_VERSION: 15.36.0
      FIREBASE_JS_VERSION: 10.12.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          java-package: jre
      - name: Cache the emulator jar and the npm download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/firebase/emulators
            ~/.npm
          key: emu-loops-${{ runner.os }}-ft${{ env.FIREBASE_TOOLS_VERSION }}-fb${{ env.FIREBASE_JS_VERSION }}
      - name: Install the emulators and the SDK (outside the checkout)
        run: |
          EMU="$RUNNER_TEMP/emu-loops"
          mkdir -p "$EMU" && cd "$EMU"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --legacy-peer-deps --save-exact \
            "firebase-tools@$FIREBASE_TOOLS_VERSION" \
            "firebase@$FIREBASE_JS_VERSION"
          # Both emulators on 127.0.0.1 by name: left out, firebase-tools listens on "localhost", which can be ::1 too.
          echo '{ "firestore": { "rules": "firestore.rules" }, "emulators": { "firestore": { "host": "127.0.0.1", "port": 8089 }, "auth": { "host": "127.0.0.1", "port": 9099 }, "ui": { "enabled": false } } }' > firebase.json
          cp "$GITHUB_WORKSPACE/firestore.rules" .
          java -version
          npx --no-install firebase --version
      - name: Run the loops on the emulators
        env:
          # One line per tool: the file, then its own arguments (--deps and --site are added).
          EMU_TOOLS: |
            tools/signin-loop.mjs --plants
            tools/progress-emu-loop.mjs --plants
        run: |
          # GitHub runs this with -e and pipefail; one tool failing must not stop the other.
          set +e +o pipefail
          EMU="$RUNNER_TEMP/emu-loops"
          esc()  { printf '%s' "$1" | awk 'BEGIN { ORS = "" } { gsub(/%/, "%25"); gsub(/\r/, "%0D"); if (NR > 1) printf "%%0A"; print }'; }
          escp() { esc "$1" | awk 'BEGIN { ORS = "" } { gsub(/:/, "%3A"); gsub(/,/, "%2C"); print }'; }
          failed=0
          while read -r tool args; do
            [ -z "$tool" ] && continue
            if [ ! -f "$tool" ]; then
              echo "::error title=$(escp "$(basename "$tool")")::$(esc "$tool is listed in EMU_TOOLS in .github/workflows/rules.yml but is not in the repo.")"
              failed=1; continue
            fi
            name="$(basename "$tool")"
            log="$EMU/$name.log"
            echo "::group::$tool $args"
            # Each tool in its own emulators, so one cannot leave data or accounts behind for the other. The output
            # streams into the job log as it comes (tee): run 45870814442 kept it in a file and showed nothing for
            # 24 minutes. `timeout` ends the emulators and the tool together if the tool's own deadline ever fails.
            ( cd "$EMU" && timeout --kill-after=20 600 npx --no-install firebase emulators:exec --only firestore,auth --project demo-gc \
                "node $GITHUB_WORKSPACE/$tool --deps $EMU --site $GITHUB_WORKSPACE $args" ) < /dev/null 2>&1 | tee "$log"
            code=${PIPESTATUS[0]}
            if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
              # A tool whose own watchdog fired has said where it hung (": HUNG at \"") and may have ended with a
              # SIGKILL (137): no second line saying its deadline did not work.
              if ! grep -q ': HUNG at "' "$log"; then
                echo "✗ $name: killed after 600 s by the step's timeout (its own deadline did not end it): 0 passed, 1 failed" | tee -a "$log"
              fi
              # What timeout's signal did not reach (the emulators under npx) would hold the ports for the next tool.
              pkill -f cloud-firestore-emulator; pkill -f 'firebase emulators:exec'; sleep 2
            fi
            echo "::endgroup::"
            summary="$(grep -E '^(✓|✗) .*(passed, [0-9]+ failed|breaks caught)$' "$log" | tr '\n' ' ' | sed 's/ *$//')"
            took="$(grep -E '^time: ' "$log" | tail -n 1)"
            cases="$(awk '/^      / { reason = $0; next } /^  ✗ / { line = $0; sub(/^  ✗ /, "", line); sub(/^ +/, "", reason); print "✗ " line (reason != "" ? "  [" reason "]" : "") } { reason = "" }' "$log")"
            if [ "$code" -eq 0 ] && [ -n "$summary" ]; then
              echo "::notice title=$(escp "$name")::$(esc "$summary ${took}")"
            else
              failed=1
              if [ -z "$cases" ]; then
                body="exit code $code and no failing case printed: the install, the emulators or the tool itself failed. Last lines of the log:"$'\n'"$(tail -n 15 "$log")"
              else
                n="$(printf '%s\n' "$cases" | grep -c '^✗')"
                body="$n failing (first 30 shown), ${took}:"$'\n'"$(printf '%s\n' "$cases" | head -n 30)"
              fi
              echo "::error title=$(escp "$name: ${summary:-no summary line}")::$(esc "$body")"
            fi
          done <<< "$EMU_TOOLS"
          exit $failed
