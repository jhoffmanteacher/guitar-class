# Runs the site's checks on GitHub after every push to main, as a second
# safety net behind the local git hooks (.githooks/). The hooks only run when
# node is found on the machine that pushes; this run does not depend on that.
#
# It runs the read-only form (`--check --skip-links`): it changes no file, and
# it skips the ~240 outside links, which the full `node tools/checks.mjs`
# before every push already covers and which fail at random from a datacentre.
#
# It does not block a push or the Pages deploy: a red run means "look at the
# last push". GitHub emails the pusher when a run fails.
#
# The second job runs the quick Node-only proof tools that CLAUDE.md asks for
# after a change to their area (the save path, what a student sees, the live
# quiz, a shared Chromebook). On GitHub they run after EVERY push, so a change
# that touched one of those areas without its proof being run is still caught.
# Each tool prints a replay command for any case that fails.
#
# The third job, lint, is the name checker (tools/lint.mjs + eslint.config.mjs):
# ESLint, fetched by npx at a pinned version, finds names used that no script
# on the page defines (the cbFmtTime outage fixed in 8f6b67b), a top-level name two
# scripts declare, and top-level code that uses a name a later script defines.
# REPORT-ONLY for now: it never fails the run (continue-on-error, and the tool
# exits 0); its findings show as warnings on the run page.
#
# Every action is pinned to a full commit SHA, with its release in a comment
# (GitHub's hardening guide: a tag can be moved, a SHA cannot). Dependabot
# (.github/dependabot.yml) proposes new SHAs and updates the comment.
name: Site checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: node tools/checks.mjs --check --skip-links
        run: node tools/checks.mjs --check --skip-links

  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The progress save (tools/save-loop.mjs)
        run: node tools/save-loop.mjs
      - name: What a student sees and lands on (tools/visible-loop.mjs)
        if: always()
        run: node tools/visible-loop.mjs
      - name: The live quiz (tools/live-quiz-loop.mjs)
        if: always()
        run: node tools/live-quiz-loop.mjs
      - name: Two students, one Chromebook (tools/shared-chromebook-loop.mjs)
        if: always()
        run: node tools/shared-chromebook-loop.mjs

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The name checker, report-only (tools/lint.mjs)
        run: node tools/lint.mjs --github
