<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuning Simulator</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#514a7d">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#494370">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
/* Tuning Simulator — practise reading a clip-on tuner before you have a guitar.
   Standalone page, built like mood-chart.html: no app.js, no i18n.js. It reads
   localStorage 'gc-lang' and keeps its own en/es table. It never asks for the
   mic: the page makes its own sound. Palette tokens are copied from styles.css. */
:root{
  --bg:#ffffff;--bg2:#faf9f5;--bg3:#f0eee6;
  --text:#1a1a18;--text2:#5e5e58;--text3:#585852;
  --border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.16);
  --blue-bg:#e6f1fb;--blue-text:#185fa5;
  --green-bg:#eaf3de;--green-text:#3b6d11;
  --amber-bg:#faeeda;--amber-text:#854f0b;
  --red-bg:#fbe9e7;--red-text:#b3372a;
  --purple-bg:#eeedfe;--purple-text:#3c3489;--purple-border:#c5c0ee;--purple-accent:#5b52a8;
  --shadow-raised:0 10px 36px rgba(30,27,70,0.28);
  --radius:10px;--radius-sm:6px;
  --string:#8d8a80;--string-wound:#a8794a;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1e1e1c;--bg2:#272724;--bg3:#313130;
    --text:#e8e6df;--text2:#9a9a91;--text3:#9e9e95;
    --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
    --blue-bg:#0c3a6b;--blue-text:#93c4f0;
    --green-bg:#1e4208;--green-text:#a8d070;
    --amber-bg:#4a2a04;--amber-text:#f0b84a;
    --red-bg:#4a1710;--red-text:#f0968a;
    --purple-bg:#2b2752;--purple-text:#c7c1f5;--purple-border:#4a4390;--purple-accent:#8f85e8;
    --shadow-raised:0 10px 36px rgba(0,0,0,0.6);
    --string:#7d7a70;--string-wound:#b98a58;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.35;
}
button{font-family:inherit;color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:12px 20px 12px}

/* ── top bar ── */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:10px}
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:600;color:var(--text2);text-decoration:none;padding:3px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--border2)}
.crumb:hover{color:var(--text);background:var(--bg3)}
.crumb:focus-visible,.sw:focus-visible,.btn:focus-visible,.bubble:focus-visible,.peg-btn:focus-visible,.ans:focus-visible{outline:2px solid var(--purple-accent);outline-offset:2px}
.top-l{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
h1{font-size:1.5rem;margin:0;letter-spacing:-0.01em;flex-basis:100%}
.score{margin:0;font-size:.9375rem;color:var(--text2);font-variant-numeric:tabular-nums}
.top-r{display:flex;gap:8px;flex-shrink:0}
.sw{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--border2);background:var(--bg2);font-size:.875rem;cursor:pointer;color:var(--text2)}
.sw .knob{width:30px;height:16px;border-radius:999px;background:var(--bg3);box-shadow:inset 0 0 0 1px var(--border2);position:relative;flex-shrink:0;transition:background .15s}
.sw .knob::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--text2);transition:transform .15s,background .15s}
.sw[aria-checked="true"]{color:var(--purple-text);border-color:var(--purple-accent);background:var(--purple-bg)}
.sw[aria-checked="true"] .knob{background:var(--purple-accent)}
.sw[aria-checked="true"] .knob::after{transform:translateX(14px);background:#fff}
.sw[aria-disabled="true"]{opacity:.65;cursor:default}

/* ── layout: tuner left, question right ── */
.stage{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:28px;align-items:start}

/* ── the clip-on tuner (looks like a Snark: dark body, backlit LCD) ── */
.snark{background:linear-gradient(#34373c,#1d1f22);border-radius:22px;padding:14px 14px 12px;box-shadow:var(--shadow-raised)}
.snark-top{display:flex;align-items:center;justify-content:space-between;padding:0 6px 8px}
.led{width:9px;height:9px;border-radius:50%;background:#3a3f3c;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.snark[data-on="1"] .led{background:#59d96a;box-shadow:0 0 8px #59d96a}
.snark-hz{font-size:.8125rem;color:#a6aca8;font-variant-numeric:tabular-nums;min-height:1.1em}
.lcd{--lcd:#38403c;--ink:#0b120d;background:var(--lcd);color:var(--ink);border-radius:10px;padding:8px 14px 10px;box-shadow:inset 0 2px 8px rgba(0,0,0,.5);transition:background .25s}
.lcd[data-mode="off"]{--ink:#7c8781}
.lcd[data-mode="flat"]{--lcd:#6fb2f0}
.lcd[data-mode="sharp"]{--lcd:#f2b04a}
.lcd[data-mode="in"]{--lcd:#6fdc7e}
.lcd-note{font-size:6.25rem;line-height:1;font-weight:700;text-align:center;height:104px;display:flex;align-items:center;justify-content:center;letter-spacing:-0.02em}
.lcd-note.pop{animation:simPop .45s ease-out}
@keyframes simPop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.meter{position:relative;padding:14px 8px 0}
.mtrack{position:relative;height:30px}
.ticks{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;height:18px}
.ticks i{display:block;width:2px;height:9px;background:var(--ink);border-radius:1px}
.ticks i.m5{height:13px}
.ticks i.m0{height:18px;width:3px}
.needle{position:absolute;bottom:0;left:50%;width:3px;height:30px;background:var(--ink);border-radius:2px;transform:translateX(-50%);transition:left .18s ease-out,opacity .2s}
.needle::before{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid var(--ink)}
.lcd[data-mode="off"] .needle{left:50%!important;opacity:.35}
.mlabels{display:flex;justify-content:space-between;font-size:.75rem;font-weight:600;padding:4px 0 0;opacity:.85}
.lcd-status{text-align:center;font-size:.875rem;font-weight:600;min-height:20px;margin-top:6px}

/* ── the peg ── Tighten turns it counterclockwise (the note goes up), Loosen turns it clockwise (the note goes down). */
.peg-panel{display:grid;grid-template-columns:1fr 104px 1fr;gap:10px;align-items:center;margin-top:14px}
.peg-btn{min-height:76px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 8px;font-size:1rem;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none}
.peg-btn .pl{display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.peg-btn .pl svg{width:22px;height:22px;flex-shrink:0}
.peg-btn .pl svg path.arc{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round}
.peg-btn .pl svg polygon{fill:currentColor}
.peg-btn small{font-size:.75rem;font-weight:400;color:var(--text2);line-height:1.25;text-align:center}
.peg-btn small b{font-weight:600;color:var(--text)}
.peg-btn:hover:not(:disabled){background:var(--bg3)}
.peg-btn.held{background:var(--purple-bg);border-color:var(--purple-accent);color:var(--purple-text)}
.peg-btn.held small,.peg-btn.held small b{color:var(--purple-text)}
.peg-btn:disabled{opacity:.5;cursor:default}
.peg-svg{width:104px;height:104px;display:block}
.peg-svg g.rot{transform-origin:52px 52px;transition:transform .12s linear}
.peg-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.keys{font-size:.8125rem;color:var(--text2)}
.btn{min-height:44px;padding:0 16px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg2);font-size:.9375rem;cursor:pointer}
.btn:hover:not(:disabled){background:var(--bg3)}
.btn:disabled{opacity:.5;cursor:default}

/* ── the question ── */
.chips{display:flex;gap:8px;margin-bottom:10px}
.chip{font-size:.8125rem;padding:4px 12px;border-radius:999px;border:1px solid var(--border2);color:var(--text2)}
.chip.on{background:var(--purple-bg);border-color:var(--purple-accent);color:var(--purple-text);font-weight:600}
.chip.past{opacity:.6}
h2{font-size:1.5rem;margin:0 0 2px;line-height:1.2}
.hint{margin:0 0 10px;color:var(--text2);font-size:.9375rem;min-height:2.7em}
.board{display:grid;grid-template-columns:minmax(0,1fr) 224px;gap:14px;align-items:start}

.strings{display:flex;flex-direction:column;gap:2px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px}
.srow{display:grid;grid-template-columns:1fr 112px;align-items:center;gap:12px;height:34px;border-radius:var(--radius-sm);padding:0 6px;transition:background .15s}
.srow.on{background:var(--purple-bg)}
.sline{height:var(--th);border-radius:3px;background:var(--string);position:relative}
.sline.wound{background:var(--string-wound)}
.srow.on .sline{background:var(--purple-accent);box-shadow:0 0 10px var(--purple-accent)}
.slot{display:flex;justify-content:flex-start}
.bubble{min-width:96px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--border2);background:var(--bg);font-size:.875rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:opacity .6s,border-color .15s}
.bubble small{font-weight:400;color:var(--text2)}
.bubble:hover:not(:disabled){background:var(--bg3)}
.bubble:disabled{cursor:default}
.bubble.right{background:var(--green-bg);border-color:var(--green-text);color:var(--green-text)}
.bubble.wrong{background:var(--red-bg);border-color:var(--red-text);color:var(--red-text)}
.strings.nonames .bubble{opacity:0;pointer-events:none}

/* ── the circle of notes: the 12 notes round a ring, going UP counterclockwise (the way the peg turns to raise the note) ── */
.ringbox{display:flex;flex-direction:column;align-items:center;gap:2px}
#ring{width:224px;height:224px;display:block;overflow:visible}
.rguide{fill:none;stroke:var(--border2);stroke-width:1.5;stroke-dasharray:2 5}
.rn circle{fill:var(--bg);stroke:var(--border2);stroke-width:1.5}
.rn text{fill:var(--text);font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:central;font-family:inherit}
.rn.tgt circle{fill:var(--purple-bg);stroke:var(--purple-accent);stroke-width:3.5}
.rn.tgt text{fill:var(--purple-text)}
.rn.cur circle{fill:var(--amber-bg);stroke:var(--amber-text);stroke-width:3.5}
.rn.cur text{fill:var(--amber-text)}
.rn.tgt.cur circle{fill:var(--green-bg);stroke:var(--green-text)}
.rn.tgt.cur text{fill:var(--green-text)}
.rarc{fill:none;stroke:var(--purple-accent);stroke-width:3;stroke-linecap:round}
.ahead{fill:var(--purple-accent)}
.rc1{fill:var(--text);font-size:15px;font-weight:700;text-anchor:middle;font-family:inherit}
.rc2{fill:var(--text2);font-size:13px;text-anchor:middle;font-family:inherit}
.legend{display:flex;gap:14px;font-size:.8125rem;color:var(--text2)}
.legend .lg{display:inline-flex;align-items:center;gap:5px}
.legend .dot{width:12px;height:12px;border-radius:50%;border:3px solid var(--purple-accent);background:var(--purple-bg);display:inline-block}
.legend .dot.cur{border-color:var(--amber-text);background:var(--amber-bg)}

.answers{min-height:52px;margin-top:10px;display:flex;gap:10px;align-items:center}
.ans{flex:0 1 auto;min-height:44px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg2);font-size:1rem;font-weight:600;cursor:pointer;padding:0 18px}
.ans:hover:not(:disabled){background:var(--bg3)}
.ans.right{background:var(--green-bg);border-color:var(--green-text);color:var(--green-text)}
.ans.wrong{background:var(--red-bg);border-color:var(--red-text);color:var(--red-text)}
.ans:focus-visible{outline:2px solid var(--purple-accent);outline-offset:2px}
.ans.six{flex:1 1 0;min-height:48px;font-size:.9375rem;padding:0 4px}
.plain{color:var(--text2);font-size:.9375rem;align-self:center}
.feedback{margin:8px 0 0;min-height:2.6em;font-size:1rem;color:var(--text)}
.feedback.note{margin-top:2px;min-height:1.4em}
.feedback.bad{color:var(--red-text)}
.feedback.ok{color:var(--green-text)}
.feedback.note{color:var(--purple-text)}
@media(prefers-reduced-motion:reduce){.lcd-note.pop{animation:none}.needle,.peg-svg g.rot,.bubble{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-l">
      <a class="crumb" id="back-link" href="index.html">&larr; <span data-t="back">Back to class site</span></a>
      <h1 data-t="title">Tuning Simulator</h1>
      <p class="score" id="score" aria-live="polite"></p>
    </div>
    <div class="top-r">
      <button type="button" class="sw" id="sound-sw" role="switch" aria-checked="true"><span class="knob" aria-hidden="true"></span><span id="sound-lbl"></span></button>
      <button type="button" class="sw" id="names-sw" role="switch" aria-checked="true"><span class="knob" aria-hidden="true"></span><span data-t="showNames">Show the string names</span></button>
    </div>
  </header>

  <main class="stage">
    <section class="left" aria-label="Tuner" data-tl="secTuner">
      <div class="snark" id="snark" data-on="0">
        <div class="snark-top"><span class="led" aria-hidden="true"></span><span class="snark-hz notranslate" id="hz" translate="no"></span></div>
        <div class="lcd" id="lcd" data-mode="off">
          <div class="lcd-note notranslate" id="note" translate="no">&mdash;</div>
          <div class="meter">
            <div class="mtrack">
              <div class="ticks" id="ticks" aria-hidden="true"></div>
              <div class="needle" id="needle"></div>
            </div>
            <div class="mlabels"><span data-t="flat">flat</span><span data-t="inTune">in tune</span><span data-t="sharp">sharp</span></div>
          </div>
          <div class="lcd-status" id="status" aria-live="polite"></div>
        </div>
      </div>

      <div class="peg-panel">
        <button type="button" class="peg-btn" id="peg-up" data-dir="1"><span class="pl"><svg viewBox="0 0 40 40" aria-hidden="true"><g transform="translate(40,0) scale(-1,1)"><path class="arc" d="M8.74 13.5 A13 13 0 1 1 13.5 31.26"/><polygon points="7.44,27.76 15.75,27.36 11.25,35.16"/></g></svg><span data-t="tighten">Tighten</span></span><small><b data-t="tightenTurn">turn counterclockwise</b><br><span data-t="tightenSub">note goes up</span></small></button>
        <svg class="peg-svg" viewBox="0 0 104 104" aria-hidden="true">
          <g class="rot" id="peg-rot">
            <circle cx="52" cy="52" r="46" fill="#9a9d9f" stroke="#5c5f61" stroke-width="2"/>
            <g fill="#c7c9ca" stroke="#5c5f61" stroke-width="1.5">
              <circle cx="52" cy="14" r="11"/><circle cx="85" cy="33" r="11"/><circle cx="85" cy="71" r="11"/>
              <circle cx="52" cy="90" r="11"/><circle cx="19" cy="71" r="11"/><circle cx="19" cy="33" r="11"/>
            </g>
            <circle cx="52" cy="52" r="20" fill="#74777a" stroke="#4d5052" stroke-width="2"/>
            <rect x="49" y="26" width="6" height="22" rx="3" fill="#f0f0ee"/>
          </g>
        </svg>
        <button type="button" class="peg-btn" id="peg-down" data-dir="-1"><span class="pl"><svg viewBox="0 0 40 40" aria-hidden="true"><path class="arc" d="M8.74 13.5 A13 13 0 1 1 13.5 31.26"/><polygon points="7.44,27.76 15.75,27.36 11.25,35.16"/></svg><span data-t="loosen">Loosen</span></span><small><b data-t="loosenTurn">turn clockwise</b><br><span data-t="loosenSub">note goes down</span></small></button>
      </div>
      <div class="peg-foot">
        <button type="button" class="btn" id="pluck" data-t="pluck">Pluck again</button>
        <span class="keys" data-t="keys">Keys: &larr; counterclockwise (tighten) &middot; &rarr; clockwise (loosen)</span>
      </div>
    </section>

    <section class="right" aria-label="Question" data-tl="secQuestion">
      <div class="chips" id="chips"></div>
      <h2 id="prompt"></h2>
      <p class="hint" id="hint"></p>
      <div class="board">
        <div class="strings" id="strings"></div>
        <div class="ringbox">
          <svg id="ring" viewBox="0 0 224 224" role="img" data-tl="ringLabel"></svg>
          <div class="legend"><span class="lg"><i class="dot" aria-hidden="true"></i><span data-t="legStr">string</span></span><span class="lg"><i class="dot cur" aria-hidden="true"></i><span data-t="legTun">tuner shows</span></span></div>
        </div>
      </div>
      <div class="answers" id="answers"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <p class="feedback note" id="note2" aria-live="polite"></p>
    </section>
  </main>
</div>

<script>
/* ═══ ROUND LOGIC — pure, no DOM. tools/tuning-sim-proof.mjs extracts the text
   between these two markers and runs it 1,000 times. Keep it free of document
   and window references. ═══ */
/* ROUND-LOGIC-START */
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
/* The same six values as STRING_TARGETS in tuner.js, low E first. */
const STRINGS = [
  { id:'E2', freq:82.41,  note:'E' },
  { id:'A2', freq:110.00, note:'A' },
  { id:'D3', freq:146.83, note:'D' },
  { id:'G3', freq:196.00, note:'G' },
  { id:'B3', freq:246.94, note:'B' },
  { id:'E4', freq:329.63, note:'E' }
];
const MIN_DETUNE = 12, MAX_DETUNE = 45;   // level 1: cents, flat or sharp; never already green, never a new letter
/* Levels 2-4: the string starts whole notes away (one note = one fret = 100 cents), flat or sharp, so the tuner
   shows another letter. Level 4 goes up to 5 notes, a 4th. A 5th (7 notes) is not drawn: round the circle it is a
   4th the other way, so the student would tune it from the other side. */
const LEVELS = [ { min:0, max:0 }, { min:1, max:2 }, { min:2, max:4 }, { min:3, max:5 } ];
const JITTER = 20;                        // levels 2-4: plus or minus this many cents on top, so the needle is not always centred
const CLEAN_TO_LEVEL_UP = 3;              // rounds in a row with no wrong name and no wrong way
const TICK_CENTS = 2;                     // one peg tick
const PEG_LIMIT = 650;                    // the peg stops here, either way
const STREAK_TO_PHASE2 = 6;               // one full set of strings named right in a row
const DONE_MS = 1000;                     // green for this long = tuned
const DEFAULTS = { soundOn: true, namesShownPhase1: true, namesShownPhase2: false };

function nearestNote(freq){
  const n = Math.round(12 * Math.log2(freq / 440)) + 69;
  const exact = 440 * Math.pow(2, (n - 69) / 12);
  return { name: NOTES[((n % 12) + 12) % 12], cents: Math.round(1200 * Math.log2(freq / exact)) };
}
function centsToFreq(idx, cents){ return STRINGS[idx].freq * Math.pow(2, cents / 1200); }
function pickString(prev, rnd){
  let i;
  do { i = Math.floor(rnd() * STRINGS.length); } while (i === prev);
  return i;
}
function pickDetune(rnd, level){
  const L = LEVELS[(level || 1) - 1];
  if (!L.max) {
    const mag = MIN_DETUNE + Math.floor(rnd() * (MAX_DETUNE - MIN_DETUNE + 1));
    return (rnd() < 0.5 ? -1 : 1) * mag;
  }
  const notes = L.min + Math.floor(rnd() * (L.max - L.min + 1));
  const jit = Math.floor(rnd() * (2 * JITTER + 1)) - JITTER;
  return (rnd() < 0.5 ? -1 : 1) * notes * 100 + jit;
}
function rightWay(cents){ return cents < 0 ? 'up' : 'down'; }
/* The circle of notes: from the letter the tuner shows to the string's letter, the short way round.
   Up is counterclockwise, the way the peg turns to tighten. */
function ringMove(from, to){
  const d = ((NOTES.indexOf(to) - NOTES.indexOf(from)) % 12 + 12) % 12;
  if (d === 0) return { n: 0, way: '' };
  return d <= 6 ? { n: d, way: 'up' } : { n: 12 - d, way: 'down' };
}
function makeRound(prev, rnd, level){
  const idx = pickString(prev, rnd), cents = pickDetune(rnd, level);
  const letter = nearestNote(centsToFreq(idx, cents)).name, target = STRINGS[idx].note;
  return { idx, cents, answer: rightWay(cents), letter, target, steps: ringMove(letter, target).n };
}
/* Sticky in-tune band, same numbers as tuner.js: enter green inside +-8 cents,
   leave only outside +-11. */
function stickyInTune(was, shown){ return was ? Math.abs(shown) <= 11 : Math.abs(shown) < 8; }
/* ROUND-LOGIC-END */

(function(){
'use strict';

/* ── language ── */

/* ── saved: whether this browser has reached Phase 2, and its level ── */

function loadPhase2(){ try { return localStorage.getItem(PHASE2_KEY) === '1'; } catch(e){ return false; } }
function savePhase2(){ try { localStorage.setItem(PHASE2_KEY, '1'); } catch(e){} }
function clampLevel(n){ n = Math.round(+n); return n >= 1 && n <= LEVELS.length ? n : 1; }
function loadLevel(){
  try { const q = new URLSearchParams(location.search).get('level'); if (q) return clampLevel(q); } catch(e){}   // ?level=4 lets a teacher look at a level
  try { return clampLevel(localStorage.getItem(LEVEL_KEY)); } catch(e){ return 1; }
}
function saveLevel(){ try { localStorage.setItem(LEVEL_KEY, String(S.level)); } catch(e){} }

/* ── timers: everything started here is stopped in stopAll() ── */
let doneTimer = 0, nextTimer = 0, holdTimer = 0, popTimer = 0;
let holdDir = 0, holdStart = 0, keyDir = 0, keyLast = 0, keyStart = 0;

/* ═══ SOUND — a self-contained plucked-string voice (Karplus-Strong) ═══
   No files, no playNote(): app.js is not loaded on this page. One buffer per
   string, made once at the string's target pitch. The voice plays it with a
   playbackRate, so turning the peg GLIDES the pitch (setTargetAtTime) instead
   of re-plucking on every tick. */
let ctx = null, master = null, voice = null;
const kBuf = {}, kActual = {};
function ensureCtx(){
  if (ctx) { if (ctx.state === 'suspended') ctx.resume().catch(()=>{}); return ctx; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try { ctx = new AC(); } catch(e){ return null; }
  master = ctx.createGain(); master.gain.value = 0.32;     // well under the backing tracks
  master.connect(ctx.destination);
  return ctx;
}
function ksBuffer(i){
  if (kBuf[i]) return kBuf[i];
  const sr = ctx.sampleRate, f = STRINGS[i].freq;
  const L = Math.max(2, Math.round(sr / f - 0.5));       // the averaging filter adds half a sample of delay
  kActual[i] = sr / (L + 0.5);
  const n = Math.floor(sr * 3.2);
  const buf = ctx.createBuffer(1, n, sr), d = buf.getChannelData(0);
  const ring = new Float32Array(L);
  let seed = 9301 + i * 977, prevN = 0;
  for (let k = 0; k < L; k++) {                           // a softened noise burst = the pick
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    const r = (seed / 0x7fffffff) * 2 - 1;
    prevN = prevN * 0.4 + r * 0.6; ring[k] = prevN;
  }
  const rho = Math.pow(0.001, (L / sr) / 2.4);            // about -60 dB after 2.4 s, on every string
  let idx = 0, peak = 0;
  for (let k = 0; k < n; k++) {
    const a = ring[idx], b = ring[(idx + 1) % L];
    d[k] = a; if (Math.abs(a) > peak) peak = Math.abs(a);
    ring[idx] = rho * 0.5 * (a + b);
    idx = (idx + 1) % L;
  }
  const g = peak > 0 ? 0.9 / peak : 1, fade = Math.floor(sr * 0.25);
  for (let k = 0; k < n; k++) d[k] *= g * (k > n - fade ? (n - k) / fade : 1);
  kBuf[i] = buf;
  return buf;
}
const LEVEL = [1.7, 1.45, 1.2, 1.05, 0.95, 0.85];        // the low strings are quiet on laptop speakers
function rateFor(i, cents){ return centsToFreq(i, cents) / kActual[i]; }
function stopVoice(sec){
  if (!voice) return;
  const v = voice; voice = null;
  try {
    if (sec > 0 && ctx) { v.g.gain.cancelScheduledValues(ctx.currentTime); v.g.gain.setTargetAtTime(0, ctx.currentTime, sec / 3); v.src.stop(ctx.currentTime + sec); }
    else v.src.stop();
  } catch(e){}
}
function pluck(i, cents, level){
  if (!S.soundOn || !ensureCtx()) return;
  stopVoice(0.05);
  const buf = ksBuffer(i);
  const src = ctx.createBufferSource(), g = ctx.createGain();
  src.buffer = buf; src.playbackRate.value = rateFor(i, cents);
  g.gain.value = (level || 1) * LEVEL[i];
  src.connect(g); g.connect(master);
  src.onended = () => { if (voice && voice.src === src) voice = null; };
  src.start();
  voice = { src, g, i, t0: ctx.currentTime };
}
function voiceAlive(){ return voice && ctx && ctx.currentTime - voice.t0 < 2.0; }
function followPitch(){
  if (!S.soundOn || !S.round) return;
  if (voiceAlive()) { voice.src.playbackRate.setTargetAtTime(rateFor(voice.i, S.cents), ctx.currentTime, 0.03); }
  else pluck(S.round.idx, S.cents, 0.6);                  // the note has died away: a soft pluck so you hear where you are
}

/* ═══ THE CIRCLE OF NOTES ═══
   The 12 notes round a ring. Going UP is counterclockwise, the same way the peg turns to tighten.
   Purple = the string's note, amber = the note the tuner shows now; both on one note = green.
   After the student answers Up or Down, an arrow shows the short way round from where the tuner started. */
const RC = 112, RR = 88, RA = 58;
const ringNodes = [];
function ringPt(i, r){ const a = -i * Math.PI / 6; return [RC + r * Math.sin(a), RC - r * Math.cos(a)]; }
function ringInit(){
  let h = '<defs><marker id="ahead" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="ahead"/></marker></defs>';
  h += '<circle class="rguide" cx="' + RC + '" cy="' + RC + '" r="' + RR + '"/>';
  NOTES.forEach((n, i) => { const [x, y] = ringPt(i, RR); h += '<g class="rn" data-note="' + n + '"><circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="18"/><text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '">' + n + '</text></g>'; });
  h += '<path id="rarc" class="rarc" d=""/><text id="rc1" class="rc1" x="' + RC + '" y="' + (RC - 4) + '"></text><text id="rc2" class="rc2" x="' + RC + '" y="' + (RC + 16) + '"></text>';
  el.ring.innerHTML = h;
  el.ring.querySelectorAll('.rn').forEach(g => ringNodes.push(g));
}
function stepsText(n){ return T(n === 1 ? 'step1' : 'stepN', { n }); }
function ringRender(){
  const r = S.round, known = !!r && S.state !== 'name';
  const tgt = known ? r.target : '', cur = known && S.disp.letter ? S.disp.letter : '';
  ringNodes.forEach(g => { const n = g.getAttribute('data-note'); g.classList.toggle('tgt', n === tgt); g.classList.toggle('cur', n === cur); });
  const arc = $('rarc'), c1 = $('rc1'), c2 = $('rc2');
  if (known && r.steps > 0 && (S.state === 'turn' || S.state === 'between')) {
    const a = NOTES.indexOf(r.letter), b = NOTES.indexOf(r.target), up = r.answer === 'up';
    const [x1, y1] = ringPt(a, RA), [x2, y2] = ringPt(b, RA);
    arc.setAttribute('d', 'M' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' A' + RA + ' ' + RA + ' 0 0 ' + (up ? 0 : 1) + ' ' + x2.toFixed(1) + ' ' + y2.toFixed(1));
    arc.setAttribute('marker-end', 'url(#ahead)');
    c1.textContent = stepsText(r.steps); c2.textContent = T(up ? 'ringUp' : 'ringDown');
  } else {
    arc.setAttribute('d', ''); arc.removeAttribute('marker-end');
    c1.textContent = T('ringUp'); c2.textContent = T('ringDown');
  }
}

/* ═══ THE TUNER DISPLAY (same rules as tuner.js, in string-lock mode) ═══ */
function ticksInit(){
  let h = '';
  for (let c = -50; c <= 50; c += 5) h += '<i class="' + (c === 0 ? 'm0' : (c % 25 === 0 ? 'm5' : '')) + '"></i>';
  $('ticks').innerHTML = h;
}
function flashPop(){
  el.note.classList.remove('pop'); void el.note.offsetWidth; el.note.classList.add('pop');
  clearTimeout(popTimer); popTimer = setTimeout(() => el.note.classList.remove('pop'), 500);
}
function lcdOff(){
  S.disp.shown = null; S.disp.letter = null; S.disp.green = false; S.disp.inTune = false;
  el.snark.dataset.on = '0'; el.lcd.dataset.mode = 'off';
  el.note.textContent = '—'; el.hz.textContent = '';
  el.needle.style.left = '50%'; el.status.textContent = '';
  el.note.classList.remove('pop');
  ringRender();
}
/* The tuner shows the note nearest the pitch and how far the needle is from THAT note, like a real one.
   The string is done when it shows the string's own letter, green. Green on another letter is not done. */
function updateDisplay(){
  if (!S.round || (S.state !== 'turn' && S.state !== 'read' && S.state !== 'between')) { lcdOff(); return; }
  const target = S.round.idx, tLetter = STRINGS[target].note;
  const freq = centsToFreq(target, S.cents);
  const nn = nearestNote(freq);
  const clamped = Math.max(-50, Math.min(50, nn.cents));
  const D = S.disp;
  if (D.shown === null || nn.name !== D.letter || Math.abs(clamped - D.shown) >= 2 || (clamped === 0 && D.shown !== 0)) {
    D.shown = clamped;
    el.needle.style.left = (50 + clamped) + '%';
  }
  D.letter = nn.name;
  el.snark.dataset.on = '1';
  el.note.textContent = nn.name;
  el.hz.textContent = (Math.round(freq * 10) / 10) + ' Hz';
  const green = stickyInTune(D.green, D.shown), onTarget = nn.name === tLetter;
  if (green && !D.green && onTarget) flashPop();
  D.green = green; D.inTune = green && onTarget;
  el.lcd.dataset.mode = green ? 'in' : (D.shown > 0 ? 'sharp' : 'flat');
  el.status.textContent = !onTarget ? T('stOther', { x: nn.name, y: tLetter }) : green ? T('stInTune') : (D.shown > 0 ? T('stSharp') : T('stFlat'));
  ringRender();
  checkGreen();
}
function checkGreen(){
  if (S.state !== 'turn') return;
  if (S.disp.inTune) { if (!doneTimer) doneTimer = setTimeout(finishRound, DONE_MS); }
  else if (doneTimer) { clearTimeout(doneTimer); doneTimer = 0; }
}

/* ═══ ROUNDS ═══ */
function newRound(){
  clearTimeout(nextTimer); nextTimer = 0;
  clearTimeout(doneTimer); doneTimer = 0;
  stopVoice(0.15);
  S.round = makeRound(S.prev, Math.random, S.level);
  S.prev = S.round.idx;
  S.cents = S.round.cents; S.pegAngle = 0;
  el.pegRot.style.transform = 'rotate(0deg)';
  S.picked = -1; S.wayPicked = ''; S.missRound = false; S.roundClean = true;
  S.state = 'name';
  S.fb = ''; S.fbClass = '';
  lcdOff();
  render();
  focusFirst();
}
function answerName(i){
  if (S.state !== 'name') return;
  ensureCtx();
  const right = S.round.idx;
  S.picked = i; S.note = '';
  if (i === right) {
    S.streak++;
    S.fb = T('nameOk', { a: nameOf(right) }); S.fbClass = 'ok';
    if (S.phase === 1 && S.streak >= STREAK_TO_PHASE2) {
      S.phase = 2; S.showNames = DEFAULTS.namesShownPhase2; savePhase2();
      S.note = T('phase2');
    }
  } else {
    S.streak = 0; S.roundClean = false;
    if (S.phase === 2) { S.missRound = true; S.fb = T('nameBadBack', { a: nameOf(right), b: nameOf(i) }); }
    else S.fb = T('nameBad', { a: nameOf(right), b: nameOf(i) });
    S.fbClass = 'bad';
  }
  S.state = 'read';
  updateDisplay();
  render();
  pluck(S.round.idx, S.cents, 1);
  focusFirst();
}
/* What the student reads after answering Up or Down: the needle on level 1, the circle on the others. */
function waySentence(r){
  if (!r.steps) return r.answer === 'up' ? T('wayFlat') : T('waySharp');
  return T(r.answer === 'up' ? 'wayUpN' : 'wayDownN', { x: r.letter, y: r.target, s: stepsText(r.steps) });
}
function answerWay(w){
  if (S.state !== 'read') return;
  S.wayPicked = w;
  const sentence = waySentence(S.round);
  if (w === S.round.answer) { S.fb = sentence; S.fbClass = 'ok'; }
  else { S.fb = T('wayWrong') + sentence; S.fbClass = 'bad'; S.roundClean = false; }
  S.state = 'turn';
  render();
  updateDisplay();
}
function finishRound(){
  doneTimer = 0;
  if (S.state !== 'turn') return;
  S.state = 'between';
  S.tuned++;
  S.fb = T('done', { a: nameOf(S.round.idx) }); S.fbClass = 'ok';
  /* Three clean rounds in a row move up a level; a miss starts the count again. */
  S.clean = S.roundClean ? S.clean + 1 : 0;
  let leveled = false;
  if (S.clean >= CLEAN_TO_LEVEL_UP && S.level < LEVELS.length) {
    S.level++; S.clean = 0; saveLevel(); leveled = true;
    S.note = T('levelUp', { l: S.level, m: LEVELS[S.level - 1].max });
  }
  stopHold();
  render();
  nextTimer = setTimeout(newRound, leveled ? 3200 : 1700);
}

/* ═══ THE PEG ═══
   Tighten turns the peg COUNTERCLOCKWISE and the note goes up; Loosen turns it CLOCKWISE and the note goes down.
   (CSS rotate(): positive = clockwise.) Holding speeds up, in bigger steps for a string that starts several
   notes away; letting go and pressing again starts slow again, for the last bit. */
const DEG_PER_CENT = 4;
function stepFor(ms){ return ms < 500 ? TICK_CENTS : ms < 1100 ? 5 : ms < 1800 ? 12 : 24; }
function tick(dir, size){
  if (S.state !== 'turn') return;
  const c = size || TICK_CENTS;
  S.cents = Math.max(-PEG_LIMIT, Math.min(PEG_LIMIT, S.cents + dir * c));
  S.pegAngle -= dir * c * DEG_PER_CENT;
  el.pegRot.style.transform = 'rotate(' + S.pegAngle + 'deg)';
  followPitch();
  updateDisplay();
}
/* Holding speeds up a little, so a student can overshoot and has to come back. */
function holdDelay(ms){ return ms < 400 ? 130 : ms < 1000 ? 100 : ms < 1800 ? 72 : 52; }
function holdLoop(){
  if (!holdDir) return;
  const ms = performance.now() - holdStart;
  tick(holdDir, stepFor(ms));
  holdTimer = setTimeout(holdLoop, holdDelay(ms));
}
function startHold(dir){
  if (S.state !== 'turn') return;
  ensureCtx();
  stopHold();
  holdDir = dir; holdStart = performance.now();
  (dir > 0 ? el.pegUp : el.pegDown).classList.add('held');
  holdLoop();
}
function stopHold(){
  holdDir = 0; clearTimeout(holdTimer); holdTimer = 0;
  el.pegUp.classList.remove('held'); el.pegDown.classList.remove('held');
}

/* ═══ RENDER ═══ */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function applyStatic(){
  document.documentElement.lang = LANG;
  document.title = T('title');
  document.querySelectorAll('[data-t]').forEach(n => {
    const k = n.getAttribute('data-t');
    if (k === 'back') { n.textContent = T('back'); return; }
    n.textContent = T(k);
  });
  document.querySelectorAll('[data-tl]').forEach(n => n.setAttribute('aria-label', T(n.getAttribute('data-tl'))));
  el.soundSw.querySelector('#sound-lbl').textContent = S.soundOn ? T('soundOn') : T('soundOff');
}
function render(){
  const st = S.state;
  el.score.textContent = T('score', { l: S.level, m: LEVELS.length, n: S.tuned, k: S.streak });
  // chips
  const order = ['name', 'read', 'turn'];
  const cur = st === 'between' ? 2 : order.indexOf(st);
  el.chips.innerHTML = ['chip1','chip2','chip3'].map((k, i) =>
    '<span class="chip' + (i === cur ? ' on' : (i < cur ? ' past' : '')) + '">' + (i + 1) + ' · ' + esc(T(k)) + '</span>').join('');
  // prompt + hint
  const p = st === 'name' ? 'p1' : st === 'read' ? 'p2' : st === 'turn' ? 'p3' : 'p4';
  const far = !!S.round && S.round.steps > 0, y = S.round ? S.round.target : '';
  el.prompt.textContent = T(p, { y });
  el.hint.textContent = st === 'name' ? (S.phase === 1 ? T('h1a') : T('h1b')) : st === 'read' ? T(far ? 'h2n' : 'h2') : st === 'turn' ? T(far ? 'h3n' : 'h3', { y }) : '';
  // strings picture
  const show = namesVisible();
  const th = [5.5, 4.5, 3.6, 2.8, 2.2, 1.6];
  let sh = '';
  for (let i = 0; i < 6; i++) {
    const on = S.round && S.round.idx === i;
    let cls = 'bubble';
    if (S.picked >= 0 && S.round) { if (i === S.round.idx) cls += ' right'; else if (i === S.picked) cls += ' wrong'; }
    const label = LANG === 'es' ? esc(nameOf(i)) + ' <small>' + esc(letterOf(i)) + '</small>' : esc(nameOf(i));
    const canTap = st === 'name' && show;
    sh += '<div class="srow' + (on ? ' on' : '') + '"><div class="sline' + (i < 3 ? ' wound' : '') + '" style="--th:' + th[i] + 'px"></div>' +
      '<div class="slot"><button type="button" class="' + cls + '" data-name="' + i + '"' + (canTap ? '' : ' disabled') + (show ? '' : ' tabindex="-1" aria-hidden="true"') + '>' + label + '</button></div></div>';
  }
  el.strings.className = 'strings' + (show ? '' : ' nonames');
  el.strings.innerHTML = sh;
  // answers
  let ah = '';
  if (st === 'name') {
    if (!show) {
      for (let i = 0; i < 6; i++) ah += '<button type="button" class="ans six" data-name="' + i + '">' + esc(nameOf(i)) + '</button>';
    }
  } else if (st === 'read') {
    ah = '<button type="button" class="ans" data-way="up">' + esc(T('up')) + '</button><button type="button" class="ans" data-way="down">' + esc(T('down')) + '</button>';
  }   // while turning there are no answer buttons: the only controls are Tighten and Loosen
  el.answers.innerHTML = ah;
  el.feedback.className = 'feedback ' + S.fbClass;
  el.feedback.textContent = S.fb;
  el.note2.textContent = S.note;
  // controls
  const turning = st === 'turn';
  el.pegUp.disabled = !turning; el.pegDown.disabled = !turning;
  el.pluck.disabled = !(st === 'read' || st === 'turn');
  el.soundSw.setAttribute('aria-checked', S.soundOn ? 'true' : 'false');
  el.soundSw.querySelector('#sound-lbl').textContent = S.soundOn ? T('soundOn') : T('soundOff');
  const p1 = S.phase === 1;
  el.namesSw.setAttribute('aria-checked', namesVisible() ? 'true' : 'false');
  el.namesSw.setAttribute('aria-disabled', p1 ? 'true' : 'false');
  ringRender();
}
function focusFirst(){
  const b = el.answers.querySelector('button:not(:disabled)') || (S.state === 'name' && el.strings.querySelector('.bubble:not(:disabled)'));
  if (b && document.activeElement && document.activeElement !== document.body && !document.activeElement.closest('.top')) { try { b.focus({ preventScroll: true }); } catch(e){} }
}

/* ═══ EVENTS ═══ */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.name != null) { answerName(+t.dataset.name); return; }
  if (t.dataset.way) { ensureCtx(); answerWay(t.dataset.way); return; }
});
el.pluck.addEventListener('click', () => {
  if (S.state !== 'read' && S.state !== 'turn') return;
  ensureCtx(); pluck(S.round.idx, S.cents, 1);
});
el.soundSw.addEventListener('click', () => {
  S.soundOn = !S.soundOn;
  if (!S.soundOn) stopVoice(0.05);
  else ensureCtx();
  render();
});
el.namesSw.addEventListener('click', () => {
  if (S.phase === 1) return;                               // the names are part of Phase 1
  S.showNames = !S.showNames;
  render();
});
[el.pegUp, el.pegDown].forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); startHold(+b.dataset.dir); });
  b.addEventListener('contextmenu', e => e.preventDefault());
});
['pointerup','pointercancel'].forEach(ev => window.addEventListener(ev, stopHold));
window.addEventListener('blur', stopHold);

/* Keyboard — keydown only. Left turns the peg counterclockwise (tighten, note up), Right
   clockwise (loosen, note down), like the picture. Holding a key keeps turning (the browser's
   key repeat, paced by the same speed-up as the buttons). Every other repeat is ignored.
   Ignored while focus is in an input. */
function onKey(e){
  const tg = e.target, tag = tg && tg.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (tg && tg.isContentEditable)) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  if (S.state !== 'turn') return;
  const dir = e.key === 'ArrowLeft' ? 1 : -1, now = performance.now();
  if (!e.repeat || dir !== keyDir || now - keyLast > 700) { keyStart = now; }
  keyDir = dir; keyLast = now;
  ensureCtx();
  if (e.repeat && now - (onKey.last || 0) < holdDelay(now - keyStart) - 10) return;
  onKey.last = now;
  tick(dir, e.repeat ? stepFor(now - keyStart) : TICK_CENTS);
}
let keysOn = false;
function keysAttach(){ if (!keysOn) { document.addEventListener('keydown', onKey); keysOn = true; } }
function keysDetach(){ if (keysOn) { document.removeEventListener('keydown', onKey); keysOn = false; } }

/* Stop everything this page started: voices, timers, listeners. */
function stopAll(){
  stopHold();
  clearTimeout(doneTimer); doneTimer = 0;
  clearTimeout(nextTimer); nextTimer = 0;
  clearTimeout(popTimer); popTimer = 0;
  stopVoice(0);
  keysDetach();
  if (ctx) { try { ctx.suspend(); } catch(e){} }
}
function resumeAll(){
  keysAttach();
  if (S.state === 'between') nextTimer = setTimeout(newRound, 600);
  else if (S.state === 'turn') checkGreen();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) stopAll(); else resumeAll(); });
window.addEventListener('pagehide', () => { stopAll(); if (ctx) { try { ctx.close(); } catch(e){} ctx = null; } });
window.addEventListener('pageshow', e => { if (e.persisted) { resumeAll(); } });
window.addEventListener('storage', e => {
  if (e.key !== 'gc-lang') return;
  LANG = e.newValue === 'es' ? 'es' : 'en';
  applyStatic(); render(); updateDisplay();
});

/* Back link: hop back to where the student came from instead of stacking a second copy of the site. */
$('back-link').addEventListener('click', e => {
  let same = false;
  try { same = document.referrer && new URL(document.referrer).origin === location.origin; } catch(_){}
  if (same && history.length > 1) { e.preventDefault(); history.back(); }
});

/* A hook for tools/smoke.mjs and the proof tool; reads only. */
window.TuningSim = { S, DEFAULTS, LEVELS, makeRound, nearestNote, ringMove, STRINGS, MIN_DETUNE, MAX_DETUNE, tick, newRound,
  setLevel(n){ S.level = clampLevel(n); S.clean = 0; return S.level; } };   // setLevel does not save

ringInit();
ticksInit();
applyStatic();
keysAttach();
newRound();
})();
</script>
